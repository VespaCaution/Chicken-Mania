<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:#1a0a00;display:flex;justify-content:center;align-items:center;height:100vh;font-family:'Comic Sans MS',Arial,sans-serif;overflow:hidden;touch-action:none}
#app{width:100%;max-width:500px;height:100vh;max-height:750px;position:relative;overflow:hidden}
#ss{width:100%;height:100%;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#4A90E2,#87CEEB 30%,#90EE90 60%,#228B22);text-align:center;position:relative;flex-direction:column;overflow:hidden}
#ss::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.3),transparent 50%),radial-gradient(circle at 70% 80%,rgba(255,255,255,.2),transparent 50%)}
.gt{font-size:42px;color:#FFD700;text-shadow:3px 3px 6px rgba(0,0,0,.5),0 0 20px rgba(255,215,0,.5);animation:b 2s infinite;position:relative;z-index:10}
@keyframes b{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.gs{font-size:16px;color:#fff;margin:8px 0 15px;position:relative;z-index:10}
.ls{display:flex;gap:8px;justify-content:center;margin-bottom:15px;position:relative;z-index:10}
.lb{padding:8px 15px;border:2px solid #FFD700;background:rgba(255,255,255,.2);color:#fff;border-radius:20px;cursor:pointer;font-size:14px;pointer-events:auto}
.lb.ac{background:#FFD700;color:#333;font-weight:bold}
.sb{padding:14px 30px;font-size:20px;background:linear-gradient(145deg,#FFD700,#FFA500);border:3px solid #fff;border-radius:40px;cursor:pointer;font-weight:bold;color:#333;display:block;margin:4px auto;pointer-events:auto;position:relative;z-index:10;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.sb:active{transform:scale(.95)}
.ib{padding:10px 20px;font-size:13px;background:linear-gradient(145deg,#4CAF50,#2E7D32);border:2px solid #fff;border-radius:20px;cursor:pointer;font-weight:bold;color:#fff;display:none;margin:4px auto;pointer-events:auto;position:relative;z-index:10}
.rb{padding:8px 20px;font-size:12px;background:rgba(255,0,0,.3);border:2px solid #f44;border-radius:20px;cursor:pointer;font-weight:bold;color:#fff;margin-top:5px;display:none;pointer-events:auto;position:relative;z-index:10}
.vr{margin-top:10px;color:rgba(255,255,255,.7);font-size:11px;position:relative;z-index:10}
#gs{width:100%;height:100%;display:none;position:relative}
#w{position:relative;width:100%;height:100%;display:flex;flex-direction:column}
#c{width:100%;flex:1;min-height:280px;background:#87CEEB;touch-action:none;border-bottom:3px solid #8B4513;position:relative}
#t{background:linear-gradient(180deg,#2a1508,#1a0a00);padding:6px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #FFD700;min-height:35px}
#b{background:linear-gradient(0deg,#2a1508,#1a0a00);padding:8px;display:flex;justify-content:space-between;gap:8px;min-height:85px;border-top:2px solid #FFD700}
.h{display:flex;align-items:center;gap:4px;color:#fff;font-weight:bold;font-size:12px;background:rgba(0,0,0,.5);padding:4px 8px;border-radius:12px;border:2px solid rgba(255,215,0,.5)}
.g{display:flex;gap:4px}
.btn{width:42px;height:42px;border-radius:50%;border:2px solid #FFD700;background:linear-gradient(145deg,rgba(255,215,0,.4),rgba(255,215,0,.2));color:#fff;font-size:16px;display:flex;justify-content:center;align-items:center;cursor:pointer;pointer-events:auto;touch-action:none}
.btn:active{transform:scale(.9)}
#j{background:linear-gradient(145deg,rgba(0,255,0,.4),rgba(0,255,0,.2));border-color:#0f0}
#a{background:linear-gradient(145deg,rgba(255,0,0,.4),rgba(255,0,0,.2));border-color:#f44}
#menuBtn{position:absolute;top:5px;right:5px;z-index:60;width:35px;height:35px;border-radius:50%;border:2px solid #FFD700;background:rgba(0,0,0,.6);color:#FFD700;font-size:16px;cursor:pointer;pointer-events:auto;display:flex;justify-content:center;align-items:center}
#cs{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.95);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:100;padding:20px}
#lc{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.9);color:#FFD700;padding:20px;border-radius:15px;text-align:center;display:none;z-index:90;border:3px solid #FFD700}
#pauseMenu{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.95);color:#fff;padding:25px;border-radius:20px;text-align:center;display:none;z-index:85;border:3px solid #FFD700;min-width:220px}
#pauseMenu button{display:block;width:100%;padding:10px;margin:5px 0;background:#FFD700;border:none;border-radius:15px;cursor:pointer;font-weight:bold;font-size:14px;pointer-events:auto}
#pauseMenu button:hover{background:#FFC000}
.dpad{display:grid;grid-template-columns:42px 42px 42px;grid-template-rows:42px 42px 42px;gap:3px}
#gs.twoPlayer #c{height:40%;min-height:150px}
#gs.twoPlayer #b{flex-direction:column;min-height:90px;gap:2px;padding:4px}
#gs.twoPlayer .dpad{grid-template-columns:28px 28px 28px;grid-template-rows:28px 28px 28px;gap:2px}
#gs.twoPlayer .btn{width:28px;height:28px;font-size:10px;border-width:1px}
#gs.twoPlayer #a{width:40px;height:40px;font-size:16px}
#gs.twoPlayer #p2controls{display:flex;flex-direction:column;gap:2px}
#gs.twoPlayer #p2controls .btn{width:25px;height:25px;font-size:9px}
#gs.twoPlayer #t{min-height:25px;padding:4px}
#gs.twoPlayer .h{font-size:10px;padding:3px 5px}
</style>
</head>

</div>
<button class="sb" id="sb" style="pointer-events:auto" onclick="startGameBtn()">▶️ Start Game</button>

</div>

<div style="display:flex;flex-direction:row;gap:10px;width:100%;justify-content:center;align-items:center">
<div style="display:flex;gap:4px;align-items:center">
<div class="dpad">
<div></div><div class="btn" id="fw" style="pointer-events:auto;touch-action:none">⬆️</div><div></div>
<div class="btn" id="l" style="pointer-events:auto;touch-action:none">⬅️</div><div class="btn" id="j" style="pointer-events:auto;touch-action:none">🦘</div><div class="btn" id="r" style="pointer-events:auto;touch-action:none">➡️</div>
<div></div><div class="btn" id="bw" style="pointer-events:auto;touch-action:none">⬇️</div><div></div>
</div>

</div>

<div></div><div class="btn" id="p2fw" style="pointer-events:auto;touch-action:none">⬆️</div><div></div>
<div class="btn" id="p2l" style="pointer-events:auto;touch-action:none">⬅️</div><div class="btn" id="p2j" style="pointer-events:auto;touch-action:none">🦘</div><div class="btn" id="p2r" style="pointer-events:auto;touch-action:none">➡️</div>
<div></div><div class="btn" id="p2bw" style="pointer-events:auto;touch-action:none">⬇️</div><div></div>
</div>
<div class="btn" id="p2a" style="pointer-events:auto;touch-action:none;width:40px;height:40px;font-size:16px">⚔️</div>
</div>
</div>
</div>
<div id="cs"><div id="cp" style="font-size:70px">👨‍🌾</div><div id="ct" style="color:#FFD700;font-size:18px;text-align:center;margin:15px"></div><button onclick="skipCutscene()" style="background:#FFD700;border:none;padding:12px 30px;border-radius:20px;font-weight:bold;font-size:16px;cursor:pointer;pointer-events:auto;z-index:101" id="skb">Skip ⏭️</button></div>
<div id="lc"><h2>🎉 Complete!</h2><p id="ls"></p></div>
<div id="pauseMenu" style="display:none">
<h3 style="color:#FFD700;margin-bottom:10px">⏸️ Paused</h3>

<button onclick="quitToMenu()">🏠 Main Menu</button>

<button onclick="exitPropMode()" style="background:#f44;color:#fff;border:none;border-radius:5px;cursor:pointer;padding:3px 8px">✕</button>
</div>

document.write('<script src="https://unpkg.com/three@0.128.0/build/three.min.js"><\/script>');

<script>
let globalSkipFn=null,deferredPrompt=null,gameInstance=null,currentLang='en';
let audioContext=null,musicInterval=null,currentMusic=null,currentBeat=0;
let selectedCharacter='farmer';
let twoPlayerMode=false;
let P2=null;
let propModeActive=false;
let propObjects=[];
let propP1={x:250,y:150,hp:100,emoji:'👨‍🌾'};
let propP2=null;
const diffData={enemyHpMult:1,enemyDmgMult:1,bossHpMult:1};
const CHARACTERS={
farmer:{name:'Farmer Joe',desc:'Balanced stats',icon:'👨‍🌾',speed:0.25,jump:0.5,attack:20,color:0x4A90E2},
chicken:{name:'Chicken',desc:'Fast but weak',icon:'🐔',speed:0.35,jump:0.55,attack:10,color:0xFFFFFF},
dog:{name:'Dog',desc:'Strong but slow',icon:'🐕',speed:0.2,jump:0.45,attack:35,color:0x8B4513},
cat:{name:'Cat',desc:'High jump',icon:'🐱',speed:0.28,jump:0.7,attack:15,color:0xFF6600},
chickencat:{name:'Chicken-Cat',desc:'Meow-cluck!',icon:'🐔🐱',speed:0.3,jump:0.6,attack:18,color:0xFFD700}
};
function skipCutscene(){if(globalSkipFn){globalSkipFn();globalSkipFn=null;}}
function installApp(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;document.getElementById('ib').style.display='none';}else{alert('To install: Open in Chrome → Menu → "Add to Home Screen"');}}
function startGameBtn(){
document.getElementById('p2controls').style.display=twoPlayerMode?'flex':'none';
document.getElementById('ss').style.display='none';
document.getElementById('gs').style.display='block';
if(document.getElementById('propMode'))document.getElementById('propMode').style.display='none';
if(gameInstance){gameInstance.stop();gameInstance=null;}
initGame();
}
function toggleTwoPlayerMode(){
twoPlayerMode=!twoPlayerMode;
const btn=document.getElementById('twoPlayerBtn');
if(btn){
if(twoPlayerMode){btn.textContent='👥 2 Player: ON';btn.style.background='linear-gradient(145deg,#00FF00,#00AA00)';}
else{btn.textContent='👥 2 Player: OFF';btn.style.background='linear-gradient(145deg,#FF6600,#FF3300)';}
}
}
function exitTwoPlayer(){
twoPlayerMode=false;
const btn=document.getElementById('twoPlayerBtn');
if(btn){btn.textContent='👥 2 Player: OFF';btn.style.background='linear-gradient(145deg,#FF6600,#FF3300)';}
document.getElementById('p2controls').style.display='none';
window.I2=null;
P2=null;
if(gameInstance){gameInstance.stop();gameInstance=null;}
document.getElementById('gs').style.display='none';
document.getElementById('ss').style.display='flex';
}
function restartGame(){if(confirm(currentLang=='en'?'Restart from beginning?':'Recommencer ?')){localStorage.removeItem('cmsave');localStorage.removeItem('cmcuts');location.reload();}}
function setLang(l){
currentLang=l;
if(typeof TRANSLATIONS!=='undefined'&&TRANSLATIONS[l]){
document.getElementById('st').textContent=TRANSLATIONS[l].st;
document.getElementById('sb').textContent=TRANSLATIONS[l].sb;
document.getElementById('rb').textContent=TRANSLATIONS[l].rb;
document.getElementById('skb').textContent=TRANSLATIONS[l].sk;
if(document.getElementById('charSelectTitle'))document.getElementById('charSelectTitle').textContent=TRANSLATIONS[l].charSelect;
}
document.getElementById('le').classList.toggle('ac',l=='en');
document.getElementById('lf').classList.toggle('ac',l=='fr');
localStorage.setItem('cml',l);
}
function t(key){return (typeof TRANSLATIONS!=='undefined'&&TRANSLATIONS[currentLang]&&TRANSLATIONS[currentLang][key])||key;}
function selectCharacter(c){
selectedCharacter=c;
const charIds={farmer:'charFarmer',chicken:'charChicken',dog:'charDog',cat:'charCat',chickencat:'charChickenCat'};
for(let key in charIds){
const el=document.getElementById(charIds[key]);
if(el)el.classList.toggle('ac',key==c);
}
if(document.getElementById('charDesc'))document.getElementById('charDesc').textContent=CHARACTERS[c].name+' - '+CHARACTERS[c].desc;
localStorage.setItem('cmchar',c);
}
function togglePauseMenu(){
const pm=document.getElementById('pauseMenu');
if(!pm)return;
if(pm.style.display=='block'){resumeGame();}
else{pm.style.display='block';if(typeof stopMusic==='function')stopMusic();}
}
function resumeGame(){
const pm=document.getElementById('pauseMenu');
if(pm)pm.style.display='none';
if(typeof startMusic==='function')startMusic(typeof L!=='undefined'&&(L==3||L==7||L==10||L==15||L==20||L==25||L==30)?'boss':'farm');
}
function quitToMenu(){
const pm=document.getElementById('pauseMenu');
if(pm)pm.style.display='none';
document.getElementById('gs').style.display='none';
document.getElementById('ss').style.display='flex';
if(gameInstance){gameInstance.stop();gameInstance=null;}
if(typeof renderer!=='undefined'&&renderer){
renderer.setScissorTest(false);
renderer.setViewport(0,0,renderer.domElement.width,renderer.domElement.height);
}
}
function closeDialogue(){
const d=document.getElementById('npcDialogue');
if(d)d.remove();
if(typeof S!=='undefined')S='playing';
if(typeof npcs!=='undefined'){for(let n of npcs){n.userData.isTalking=false;}}
if(typeof startMusic==='function'){startMusic(typeof L!=='undefined'&&(L==3||L==7||L==10||L==15||L==20||L==25||L==30)?'boss':'farm');}
}
function buyItem(type){
if(typeof coins==='undefined')return;
if(type=='speed'&&coins>=50){coins-=50;if(typeof P!=='undefined')P.s=CHARACTERS[selectedCharacter].speed+0.15;if(typeof playVictorySound==='function')playVictorySound();alert(t('purchased'));}
else if(type=='attack'&&coins>=50){coins-=50;if(typeof P!=='undefined')P.au=true;if(typeof playVictorySound==='function')playVictorySound();alert(t('purchased'));}
else if(type=='shield'&&coins>=75){coins-=75;if(typeof P!=='undefined')P.hasShield=true;if(typeof playVictorySound==='function')playVictorySound();alert(t('purchased'));}
else{alert(t('insufficient'));}
closeDialogue();
if(typeof saveGame==='function')saveGame();
}
function enterPropMode(){
propModeActive=true;
document.getElementById('ss').style.display='none';
document.getElementById('gs').style.display='none';
const pm=document.getElementById('propMode');
if(pm)pm.style.display='block';
initPropMode();
}
function exitPropMode(){
propModeActive=false;
const pm=document.getElementById('propMode');
if(pm)pm.style.display='none';
document.getElementById('ss').style.display='flex';
}
function initPropMode(){
const canvas=document.getElementById('propCanvas');
if(!canvas)return;
canvas.width=500;
canvas.height=350;
propP1={x:250,y:150,hp:100,emoji:CHARACTERS[selectedCharacter].icon};
if(twoPlayerMode){propP2={x:300,y:150,hp:100,emoji:'🐔'};}
const propTypes=['tree','tree','rock','rock','fence','fence','flower','flower','hay','hay','pond','house'];
propObjects=[];
for(let i=0;i<15;i++){
const type=propTypes[Math.floor(Math.random()*propTypes.length)];
const emojis={tree:'🌳',rock:'🪨',fence:'🚧',flower:'🌸',hay:'🌾',pond:'💧',house:'🏠'};
propObjects.push({type:type,x:Math.random()*400+30,y:Math.random()*200+50,emoji:emojis[type]});
}
window.propI1={left:false,right:false,up:false,down:false,attack:false};
if(twoPlayerMode){window.propI2={left:false,right:false,up:false,down:false,attack:false};}
function bindPropBtn(id,action,target){
const el=document.getElementById(id);
if(!el)return;
el.addEventListener('touchstart',function(e){e.preventDefault();target[action]=true;},{passive:false});
el.addEventListener('touchend',function(e){e.preventDefault();target[action]=false;},{passive:false});
el.addEventListener('mousedown',function(){target[action]=true;});
el.addEventListener('mouseup',function(){target[action]=false;});
}
bindPropBtn('l','left',window.propI1);
bindPropBtn('r','right',window.propI1);
bindPropBtn('fw','up',window.propI1);
bindPropBtn('bw','down',window.propI1);
bindPropBtn('a','attack',window.propI1);
if(window.propI2){
bindPropBtn('p2l','left',window.propI2);
bindPropBtn('p2r','right',window.propI2);
bindPropBtn('p2fw','up',window.propI2);
bindPropBtn('p2bw','down',window.propI2);
bindPropBtn('p2a','attack',window.propI2);
}
function propLoopInternal(){
if(!propModeActive)return;
if(window.propI1){
if(window.propI1.left)propP1.x-=3;
if(window.propI1.right)propP1.x+=3;
if(window.propI1.up)propP1.y-=3;
if(window.propI1.down)propP1.y+=3;
if(window.propI1.attack&&propP2&&Math.abs(propP1.x-propP2.x)<35&&Math.abs(propP1.y-propP2.y)<35){propP2.hp-=5;window.propI1.attack=false;}
}
if(window.propI2&&propP2){
if(window.propI2.left)propP2.x-=3;
if(window.propI2.right)propP2.x+=3;
if(window.propI2.up)propP2.y-=3;
if(window.propI2.down)propP2.y+=3;
if(window.propI2.attack&&Math.abs(propP1.x-propP2.x)<35&&Math.abs(propP1.y-propP2.y)<35){propP1.hp-=5;window.propI2.attack=false;}
}
propP1.x=Math.max(10,Math.min(480,propP1.x));
propP1.y=Math.max(30,Math.min(290,propP1.y));
if(propP2){
propP2.x=Math.max(10,Math.min(480,propP2.x));
propP2.y=Math.max(30,Math.min(290,propP2.y));
if(propP1.hp<=0){propP1.hp=100;propP1.x=Math.random()*400+30;propP1.y=Math.random()*200+50;}
if(propP2.hp<=0){propP2.hp=100;propP2.x=Math.random()*400+30;propP2.y=Math.random()*200+50;}
}
const c=document.getElementById('propCanvas');
if(!c)return;
const ctx=c.getContext('2d');
ctx.fillStyle='#90EE90';
ctx.fillRect(0,0,500,350);
ctx.fillStyle='#8B4513';
ctx.fillRect(0,310,500,40);
for(let obj of propObjects){
ctx.font='35px Arial';
ctx.fillText(obj.emoji,obj.x,obj.y);
}
ctx.font='40px Arial';
ctx.fillText(propP1.emoji,propP1.x,propP1.y);
if(propP2){ctx.fillText(propP2.emoji,propP2.x,propP2.y);}
ctx.fillStyle='#fff';
ctx.font='12px Arial';
ctx.fillText('P1 HP: '+propP1.hp,10,20);

function playTone(freq,duration,type,volume,delay){
if(!audioContext)return;
try{
const osc=audioContext.createOscillator();
const gain=audioContext.createGain();
const startTime=audioContext.currentTime+(delay||0);
osc.type=type||'square';
osc.frequency.setValueAtTime(freq,startTime);
gain.gain.setValueAtTime(volume||0.1,startTime);
gain.gain.exponentialRampToValueAtTime(0.001,startTime+duration);
osc.connect(gain);
gain.connect(audioContext.destination);
osc.start(startTime);
osc.stop(startTime+duration);
}catch(e){}
}

const melodyNote=song.melody[currentBeat%song.melody.length];
const bassNote=song.bass[currentBeat%song.bass.length];
const hasPercussion=song.percussion[currentBeat%song.percussion.length];
playTone(melodyNote,0.25,'triangle',0.06);
playTone(bassNote,0.35,'sine',0.04);
if(hasPercussion){playTone(200,0.05,'square',0.03);playTone(150,0.03,'sawtooth',0.02);}
if(type=='boss'||type=='dungeon'){if(currentBeat%4==0)playTone(100,0.3,'sawtooth',0.03);}
currentBeat++;
if(currentBeat>=song.melody.length)currentBeat=0;
},beatDuration);
}

function updatePlayerMovement(){
let moveX=0,moveZ=0;
if(I.left)moveX-=1;
if(I.right)moveX+=1;
if(I.forward)moveZ-=1;
if(I.backward)moveZ+=1;
if(moveX!=0||moveZ!=0){
let len=Math.sqrt(moveX*moveX+moveZ*moveZ);
moveX/=len;moveZ/=len;
P.rotY=Math.atan2(moveX,moveZ);
P.isWalking=true;
}else{P.isWalking=false;}
P.vx=moveX*P.s;
P.vz=moveZ*P.s;
if(I.jump){
if(P.g){
P.vy=P.j;P.g=false;I.jump=false;
playJumpSound();
}else if(P.dj&&P.dja){
P.vy=P.j*0.8;P.dja=false;I.jump=false;
playJumpSound();
}
}
if(I.attack&&P.ac<=0){
P.ac=20;P.ad=10;P.attackCombo++;
if(P.attackCombo>3){P.ac=40;P.attackCombo=0;}
playAttackSound();
}
if(P.ac>0)P.ac--;if(P.ad>0)P.ad--;
P.vy-=0.02;if(P.vy<-0.5)P.vy=-0.5;
P.x+=P.vx;P.z+=P.vz;P.y+=P.vy;
if(P.y<=0.5){P.y=0.5;P.vy=0;P.g=true;}else{P.g=false;}
for(let p of platforms){
if(Math.abs(P.x-p.x)<p.w/2&&Math.abs(P.z-p.z)<p.d/2&&Math.abs(P.y-p.y)<1&&P.vy<=0){
P.y=p.y+0.5;P.vy=0;P.g=true;
}
}
let onBridge=false;
for(let b of bridges){
if(Math.abs(P.x-b.x)<b.w/2&&Math.abs(P.z-b.z)<1.5){
if(P.y>0.2&&P.y<1){
P.y=0.35;P.vy=0;P.g=true;
onBridge=true;
}
}
}

for(let w of waterAreas){

function updateEnemyAI(e){
if(!e.ac)return;
if(e.stationary)return;
let dx=P.x-e.x,dz=P.z-e.z;
let dist=Math.sqrt(dx*dx+dz*dz);
if(e.type=='boar'){
e.animPhase=(e.animPhase||0)+0.02;
e.x+=Math.sin(e.animPhase)*1.5;
if(e.x<3)e.x=3;
if(e.x>lw-3)e.x=lw-3;
if(dist<4&&dist>0.5){
e.x+=Math.sign(dx)*0.04;
}
e.z+=Math.sign(dz)*0.01;
}
else if(e.type=='crow'){
if(dist<6){e.x+=dx/dist*0.08;e.z+=dz/dist*0.08;e.y+=Math.sign(P.y+1-e.y)*0.05;}
else{e.x+=Math.sin(tt*0.02+e.animPhase)*0.05;e.z+=Math.cos(tt*0.02+e.animPhase)*0.05;}
if(e.mesh.userData.wings){
e.mesh.userData.wings[0].rotation.z=Math.sin(tt*0.3)*0.6;
e.mesh.userData.wings[1].rotation.z=-Math.sin(tt*0.3)*0.6;
}
}else if(e.type=='robot'){
if(dist<8){e.at++;if(e.at>=e.acd){e.at=0;projectiles.push({x:e.x,y:e.y+0.5,z:e.z,vx:Math.sign(dx)*0.15,vy:0,vz:Math.sign(dz)*0.1,life:100,mesh:createEnemy3D(e.x,e.y+0.5,e.z,'spell')});}}
else{e.x+=Math.sign(dx)*0.03;e.z+=Math.sign(dz)*0.03;}
if(e.mesh.userData.arms){
e.mesh.userData.arms[0].rotation.z=Math.sin(tt*0.1)*0.3;
e.mesh.userData.arms[1].rotation.z=-Math.sin(tt*0.1)*0.3;
}
if(e.mesh.userData.tip){e.mesh.userData.tip.scale.setScalar(1+Math.sin(tt*0.2)*0.3);}
}else if(e.type=='cf'){
if(dist<6){e.x+=dx/dist*0.04;e.z+=dz/dist*0.04;}
if(e.mesh.userData.eyes){
e.mesh.userData.eyes[0].scale.setScalar(1+Math.sin(tt*0.15)*0.2);
e.mesh.userData.eyes[1].scale.setScalar(1+Math.sin(tt*0.15)*0.2);
}
}else if(e.type=='wolf'){
if(dist<10){e.x+=dx/dist*0.1;e.z+=dz/dist*0.08;}
else{e.x+=Math.sin(tt*0.01)*0.03;e.z+=Math.cos(tt*0.01)*0.03;}
if(e.mesh.userData.legs){
e.mesh.userData.animPhase+=0.2;
for(let i=0;i<e.mesh.userData.legs.length;i++){
e.mesh.userData.legs[i].position.z=Math.sin(e.mesh.userData.animPhase+i)*0.2;
}
}
if(e.mesh.userData.tail){e.mesh.userData.tail.rotation.z=Math.sin(tt*0.1)*0.4;}
}else if(e.type=='golem'){
if(dist<8){e.x+=dx/dist*0.025;e.z+=dz/dist*0.02;}
if(e.mesh.userData.arms){
e.mesh.userData.arms[0].rotation.z=Math.sin(tt*0.05)*0.2;
e.mesh.userData.arms[1].rotation.z=-Math.sin(tt*0.05)*0.2;
}
}else if(e.type=='snake'){
if(e.mesh.userData.segments){
for(let i=0;i<e.mesh.userData.segments.length;i++){
e.mesh.userData.segments[i].position.z=Math.sin(tt*0.1+i)*0.2;
}
}
if(e.mesh.userData.tongue){e.mesh.userData.tongue.position.x=0.55+Math.sin(tt*0.2)*0.1;}
if(dist<5){e.x+=dx/dist*0.04;e.z+=dz/dist*0.04;}
}else if(e.type=='bat'){
if(dist<7){e.x+=dx/dist*0.07;e.z+=dz/dist*0.07;e.y+=Math.sign(P.y+1.5-e.y)*0.06;}
else{e.x+=Math.sin(tt*0.03+e.animPhase)*0.08;e.y+=Math.sin(tt*0.05)*0.1;}
if(e.mesh.userData.wings){
e.mesh.userData.wings[0].rotation.z=Math.sin(tt*0.4)*0.8;
e.mesh.userData.wings[1].rotation.z=-Math.sin(tt*0.4)*0.8;
}
}
e.mesh.position.x=e.x;
e.mesh.position.y=e.y||0;
e.mesh.position.z=e.z;
if(dist<1.5&&P.i<=0){

}

if(S=='playing'){upd();}
renderer.render(scene,camera);
document.getElementById('hp').style.width=(P.hp/P.mh*100)+'%';
document.getElementById('cc').textContent=coins;
document.getElementById('bc').textContent=lB+'/3';
document.getElementById('lv').textContent=t('lv')+' '+L;
drawMiniMap();
animId=requestAnimationFrame(loop);
    }
gameInstance={stop:stop};
setupControls();
mk(L);
loop();
}
if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js').catch(function(){
console.log('Service Worker registration failed');
});
}
window.addEventListener('error',function(e){
console.error('Game error:',e.message);
if(e.message&&e.message.includes('THREE')){
if(confirm('Graphics error detected. Reload page?')){
location.reload();
}
}
});
window.addEventListener('resize',function(){
if(gameInstance&&typeof camera!=='undefined'&&typeof renderer!=='undefined'){
const container=document.getElementById('c');
if(container){
const W=container.clientWidth||500;
const H=container.clientHeight||400;
camera.aspect=W/H;
camera.updateProjectionMatrix();
renderer.setSize(W,H);
}
}
});
document.addEventListener('visibilitychange',function(){
if(document.hidden&&typeof S!=='undefined'&&S=='playing'){
togglePauseMenu();
}
});
document.addEventListener('touchmove',function(e){
if(e.target.closest('#c')||e.target.closest('#b')){
e.preventDefault();
}
},{passive:false});
document.addEventListener('keydown',function(e){
if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)){
e.preventDefault();
}
});
</script>
