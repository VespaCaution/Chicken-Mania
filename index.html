<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🐔 Chicken Mania</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a0a00">
<link rel="icon" href="icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:#1a0a00;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial;overflow:hidden;touch-action:none}
#app{width:100%;max-width:500px;height:100vh;max-height:750px;position:relative}
#ss{width:100%;height:100%;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#4A90E2,#87CEEB 30%,#90EE90 60%,#228B22);text-align:center;position:relative;flex-direction:column}
.gt{font-size:48px;color:#FFD700;text-shadow:3px 3px 6px rgba(0,0,0,.5);animation:b 2s infinite}
@keyframes b{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
.gs{font-size:18px;color:#fff;margin:10px 0 20px}
.ls{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
.lb{padding:10px 20px;border:2px solid #FFD700;background:rgba(255,255,255,.2);color:#fff;border-radius:25px;cursor:pointer;font-size:16px}
.lb.ac{background:#FFD700;color:#333;font-weight:bold}
.sb{padding:18px 35px;font-size:22px;background:#FFD700;border:3px solid #fff;border-radius:50px;cursor:pointer;font-weight:bold;color:#333;display:block;margin:5px auto}
.ib{padding:12px 25px;font-size:14px;background:#4CAF50;border:2px solid #fff;border-radius:25px;cursor:pointer;font-weight:bold;color:#fff;display:none;margin:5px auto}
.rb{padding:10px 25px;font-size:14px;background:rgba(255,0,0,.3);border:2px solid #f44;border-radius:25px;cursor:pointer;font-weight:bold;color:#fff;margin-top:10px;display:none}
.vr{margin-top:15px;color:rgba(255,255,255,.7);font-size:12px}
#gs{width:100%;height:100%;display:none}
#w{position:relative;width:100%;height:100%;display:flex;flex-direction:column}
#c{width:100%;flex:1;background:#87CEEB;touch-action:none;border-bottom:3px solid #8B4513}
#t{background:#2a1508;padding:8px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #FFD700;min-height:40px}
#b{background:#2a1508;padding:10px;display:flex;justify-content:space-between;gap:10px;min-height:80px;border-top:2px solid #FFD700}
.h{display:flex;align-items:center;gap:5px;color:#fff;font-weight:bold;font-size:14px;background:rgba(0,0,0,.5);padding:5px 10px;border-radius:15px;border:2px solid rgba(255,215,0,.5)}
.g{display:flex;gap:8px}
.btn{width:55px;height:55px;border-radius:50%;border:3px solid #FFD700;background:rgba(255,215,0,.3);color:#fff;font-size:22px;display:flex;justify-content:center;align-items:center;cursor:pointer;pointer-events:auto}
.btn:active{transform:scale(.9)}
#j{background:rgba(0,255,0,.3);border-color:#0f0}
#a{background:rgba(255,0,0,.3);border-color:#f44}
#cs{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.95);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:100;padding:20px}
#lc{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.9);color:#FFD700;padding:20px;border-radius:15px;text-align:center;display:none;z-index:90;border:3px solid #FFD700}
</style>
</head>
<body>
<div id="app">
<div id="ss">
<h1 class="gt">🐔 Chicken Mania</h1>
<p class="gs" id="st">A Farm Adventure</p>
<div class="ls"><button class="lb ac" id="le" onclick="sl('en')">🇬🇧 English</button><button class="lb" id="lf" onclick="sl('fr')">🇫🇷 Français</button></div>
<button class="sb" id="sb" onclick="sg()">▶️ Start Game</button>
<button class="ib" id="ib" onclick="installApp()">📲 Install App</button>
<button class="rb" id="rb" onclick="rg()">🔄 Restart Game</button>
<p class="vr">v1.4.0</p>
</div>
<div id="gs">
<div id="w">
<div id="t">
<div class="h"><span>❤️</span><div style="width:80px;height:12px;background:#333;border-radius:6px;overflow:hidden;border:1px solid #fff"><div id="hp" style="width:100%;height:100%;background:linear-gradient(90deg,#f44,#f66)"></div></div></div>
<div class="h"><span>🪙</span><span id="cc">0</span></div>
<div class="h"><span>⭐</span><span id="bc">0/3</span></div>
<div class="h"><span>🏆</span><span id="lv">Lv 1</span></div>
</div>
<canvas id="c" width="500" height="500"></canvas>
<div id="b">
<div class="g"><div class="btn" id="l">⬅️</div><div class="btn" id="r">➡️</div></div>
<div class="g"><div class="btn" id="j">⬆️</div><div class="btn" id="a">⚔️</div></div>
</div>
<div id="cs"><div id="cp" style="font-size:80px">👨‍🌾</div><div id="ct" style="color:#FFD700;font-size:20px;text-align:center;margin:20px"></div><button onclick="skipCutscene()" style="background:#FFD700;border:none;padding:15px 40px;border-radius:25px;font-weight:bold;font-size:18px;cursor:pointer;pointer-events:auto" id="skb">Skip ⏭️</button></div>
<div id="lc"><h2>🎉 Complete!</h2><p id="ls"></p></div>
</div>
</div>
</div>
<script>
// Global skip function
let globalSkipFn=null;
function skipCutscene(){if(globalSkipFn)globalSkipFn()}

// Install button
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;document.getElementById('ib').style.display='block'});
function installApp(){if(deferredPrompt){deferredPrompt.prompt()}else{alert('To install: Open in Chrome → Menu → "Add to Home Screen"')}}
window.addEventListener('appinstalled',()=>{document.getElementById('ib').style.display='none';deferredPrompt=null});

const T={en:{st:'A Farm Adventure',sb:'▶️ Start Game',rb:'🔄 Restart Game',lv:'Level',sk:'Skip ⏭️',cm:'🎉 CONGRATULATIONS! 🎉',tc:'Total Coins',bn:'Bonus Coins',dt:'Deaths',tm:'Time'},fr:{st:'Une Aventure à la Ferme',sb:'▶️ Commencer',rb:'🔄 Recommencer',lv:'Niveau',sk:'Passer ⏭️',cm:'🎉 FÉLICITATIONS ! 🎉',tc:'Pièces Totales',bn:'Pièces Bonus',dt:'Morts',tm:'Temps'}};
let Lg=localStorage.getItem('cml')||'en';
function sl(l){Lg=l;document.getElementById('st').textContent=T[l].st;document.getElementById('sb').textContent=T[l].sb;document.getElementById('rb').textContent=T[l].rb;document.getElementById('le').classList.toggle('ac',l=='en');document.getElementById('lf').classList.toggle('ac',l=='fr');document.getElementById('skb').textContent=T[l].sk;localStorage.setItem('cml',l)}
function t(k){return T[Lg][k]||k}
sl(Lg);
if(localStorage.getItem('cmsave')){document.getElementById('rb').style.display='block';document.getElementById('sb').textContent='▶️ '+(Lg=='en'?'Continue':'Continuer')}

let gameInstance=null;

function sg(){document.getElementById('ss').style.display='none';document.getElementById('gs').style.display='block';startGame()}
function rg(){if(confirm(Lg=='en'?'Restart from beginning?':'Recommencer ?')){localStorage.removeItem('cmsave');localStorage.removeItem('cmcuts');location.reload()}}

function startGame(){
if(gameInstance){gameInstance.stop();gameInstance=null}
const C=document.getElementById('c'),X=C.getContext('2d'),W=500,H=500;
let running=true,animId=null,skipTimer=null;
let S='playing',L=1,coins=0,tc=0,bc=0,tb=0,deaths=0,tt=0,lt=0,ci=0,cs=[],lC=0,lB=0,cutscenesShown=JSON.parse(localStorage.getItem('cmcuts')||'{}');
const P={x:50,y:350,w:35,h:45,vx:0,vy:0,s:5,j:-12,hp:100,mh:100,ac:0,ad:0,f:1,g:false,i:0,dj:true,dja:true,au:false,su:false};
const I={left:false,right:false,jump:false,attack:false};
let pf=[],en=[],cl=[],bcl=[],hp=[],pr=[],pa=[],de=[],bo=null,cx=0,lw=0,gx=0,bg=[],fg=[],we=[];
const save=JSON.parse(localStorage.getItem('cmsave')||'null');
if(save){L=save.L||1;coins=save.coins||0;tc=save.tc||0;bc=save.bc||0;tb=save.tb||0;deaths=save.deaths||0;tt=save.tt||0}
const cuts={1:[['👨‍🌾',Lg=='fr'?'Fermier Joe : Quelle belle matinée !':'Farmer Joe: What a morning!'],['🐔',Lg=='fr'?'Poulet : Quelque chose ne va pas...':'Chicken: Something is wrong...'],['🐗',Lg=='fr'?'Un sanglier sauvage apparaît !':'A wild boar appears!'],['👨‍🌾',Lg=='fr'?'Je dois protéger la ferme !':'I must protect the farm!']],3:[['🧙',Lg=='fr'?'Sorcier : J\'ai corrompu ta ferme !':'Wizard: I corrupted your farm!'],['👨‍🌾',Lg=='fr'?'Tu ne gagneras pas !':'You will not win!']],5:[['👨‍🌾',Lg=='fr'?'La corruption se propage...':'The corruption spreads...'],['🐔',Lg=='fr'?'Nous devons sauver les animaux !':'We must save the animals!']],7:[['🧙',Lg=='fr'?'Tu es plus fort que je pensais !':'You are stronger than I thought!'],['👨‍🌾',Lg=='fr'?'Je n\'abandonnerai jamais !':'I will never give up!']],10:[['🔥',Lg=='fr'?'La Bataille Finale !':'The Final Battle!'],['🧙',Lg=='fr'?'IL EST TEMPS D\'EN FINIR !':'TIME TO END THIS!']],11:[['🎉',Lg=='fr'?'NIVEAU BONUS !':'BONUS LEVEL!'],['👨‍🌾',Lg=='fr'?'Tu as collecté toutes les pièces bonus !':'You collected all bonus coins!']]};

function stop(){running=false;if(animId)cancelAnimationFrame(animId);if(skipTimer)clearTimeout(skipTimer);globalSkipFn=null;document.getElementById('cs').style.display='none'}

function saveGame(){localStorage.setItem('cmsave',JSON.stringify({L:L,coins:coins,tc:tc,bc:bc,tb:tb,deaths:deaths,tt:tt}))}

function mk(L){
pf=[];en=[];cl=[];bcl=[];hp=[];pr=[];pa=[];de=[];bg=[];fg=[];we=[];bo=null;cx=0;lt=0;lC=0;lB=0;
Object.assign(P,{x:50,y:350,vx:0,vy:0,hp:100,i:0,dj:true,dja:true,au:L>=5,su:L>=7});
lw=2000+L*400;gx=lw-150;
const isBoss=(L==3||L==7||L==10||L==11);
if(isBoss){
for(let i=0;i<lw;i+=50)pf.push({x:i,y:450,w:50,h:50,t:'g'});
if(L==3||L==7)bo={x:lw-300,y:350,w:55,h:80,hp:150+L*30,mh:150+L*30,ph:1,at:0,ac:60,ac:true,ty:'w'};
else if(L==10)bo={x:lw-300,y:330,w:60,h:90,hp:400,mh:400,ph:1,at:0,ac:40,ac:true,ty:'sw'};
else bo={x:lw-300,y:310,w:70,h:100,hp:600,mh:600,ph:1,at:0,ac:25,ac:true,ty:'bb'};
}else{
for(let i=0;i<lw;i+=50){if(i>400&&i<500)continue;if(i>1200&&i<1350)continue;if(i>lw/2&&i<lw/2+150)continue;pf.push({x:i,y:450,w:50,h:50,t:'g'})}
pf.push({x:400,y:380,w:100,h:15,t:'f'});pf.push({x:1200,y:360,w:100,h:15,t:'f'});pf.push({x:lw/2,y:370,w:100,h:15,t:'f'});
for(let i=0;i<5+L;i++){let x=500+i*(lw/(5+L));if(x>350&&x<550)continue;let ty=['boar','robot','boar','cf','boar'][i%5];if(L>3&&i%3==0)en.push(mke(x,430,'robot'));else if(L>5&&i%4==0)en.push(mke(x,430,'cf'));else en.push(mke(x,430,ty))}
}
for(let i=0;i<10+L*2;i++)cl.push({x:200+i*(lw/(10+L*2)),y:380-(i%4)*40,c:false});
for(let i=0;i<3;i++)bcl.push({x:500+i*(lw/4),y:300-i*20,c:false});
for(let i=0;i<Math.floor(L/3);i++)hp.push({x:500+i*(lw/Math.floor(L/3)),y:420,c:false});
for(let i=0;i<20;i++)bg.push({x:i*150,y:200+Math.random()*150,w:250,h:250,ty:'m',co:`hsl(${200+L*8},30%,${35+L*3}%)`,s:.2});
for(let i=0;i<25;i++)bg.push({x:i*100+50,y:380,w:30,h:50,ty:'t',co:`hsl(${110+Math.random()*30},40%,${25+Math.random()*20}%)`,s:.3});
if(cuts[L]&&!cutscenesShown[L]){cutscenesShown[L]=true;localStorage.setItem('cmcuts',JSON.stringify(cutscenesShown));cs=cuts[L];ci=0;S='cutscene';document.getElementById('cs').style.display='flex';showCuts()}else S='playing';
saveGame();
}

function mke(x,y,ty){const e={boar:{w:40,h:30,hp:40,s:3,c:'#8B4513'},crow:{w:30,h:30,hp:25,s:3.5,c:'#333'},robot:{w:35,h:40,hp:50,s:2,c:'#808080'},cf:{w:45,h:50,hp:80,s:1.5,c:'#556B2F'}}[ty];return{x:x,y:y-e.h,w:e.w,h:e.h,hp:e.hp,mh:e.hp,s:e.s,c:e.c,ty:ty,vx:e.s,vy:0,ac:true,at:0,acd:60,og:false,kb:0,kn:0}}

function showCuts(){globalSkipFn=skipCuts;if(ci<cs.length){document.getElementById('cp').textContent=cs[ci][0];document.getElementById('ct').textContent=cs[ci][1];ci++;skipTimer=setTimeout(()=>{if(S=='cutscene'&&running)showCuts()},2500)}else{skipCuts()}}
function skipCuts(){if(skipTimer)clearTimeout(skipTimer);document.getElementById('cs').style.display='none';S='playing';globalSkipFn=null}

function upd(){if(!running)return;if(S!='playing')return;lt++;tt++;
if(I.left){P.vx=-P.s;P.f=-1}else if(I.right){P.vx=P.s;P.f=1}else P.vx=0;
if(I.jump){if(P.g){P.vy=P.j;P.g=false;P.dja=true;I.jump=false}else if(P.dj&&P.dja){P.vy=P.j*.8;P.dja=false;I.jump=false}}
if(I.attack&&P.ac<=0){P.ac=15;P.ad=8}
if(P.ac>0)P.ac--;if(P.ad>0)P.ad--;
P.vy+=.6;if(P.vy>15)P.vy=15;P.x+=P.vx;P.y+=P.vy;P.g=false;
for(let p of pf)if(col(P,p)){if(P.vy>0&&P.y-P.vy+P.h<=p.y+10){P.y=p.y-P.h;P.vy=0;P.g=true}}
if(P.x<0)P.x=0;if(P.x>lw-P.w)P.x=lw-P.w;
if(P.y>500||P.hp<=0){deaths++;mk(L);return}
if(P.i>0)P.i--;
ue();if(bo&&bo.ac)ub();up();cc();cx=Math.max(0,Math.min(P.x-W/2,lw-W));
if(bo&&bo.ac&&bo.hp<=0){cl__();return}
if(!bo&&P.x>=gx)cl__();
}
function ue(){for(let e of en){if(!e.ac)continue;if(e.ty=='boar'){e.x+=e.vx;if(e.x<50||e.x>lw-50)e.vx*=-1;let dx=P.x-e.x;if(Math.abs(dx)<200&&Math.abs(P.y-e.y)<80)e.vx=Math.sign(dx)*6;else e.vx=Math.sign(e.vx)*e.s}else if(e.ty=='robot'){let dx=P.x-e.x;if(Math.abs(dx)>120)e.vx=Math.sign(dx)*e.s;else{e.vx=0;e.at++;if(e.at>=e.acd){e.at=0;pr.push({x:e.x,y:e.y+e.h/2,vx:Math.sign(dx)*7,vy:0,w:8,h:5,c:'#F00',fe:true,life:120})}}}else if(e.ty=='cf'){let dx=P.x-e.x;if(Math.abs(dx)>60)e.vx=Math.sign(dx)*e.s;else{e.vx=0;e.at++;if(e.at>=40){e.at=0;if(Math.abs(P.y-e.y)<50)dp(20)}}}e.x+=e.vx;e.y+=e.vy;if(e.ty!='crow'){e.og=false;for(let p of pf){if(p.t=='g'&&col(e,p)){if(e.vy>0&&e.y+e.h-p.y<20){e.y=p.y-e.h;e.vy=0;e.og=true}}}if(!e.og){e.vy+=.5}else{e.vy=0}if(e.y>440){e.y=440-e.h;e.vy=0;e.og=true}}}}
function ub(){if(!bo||!bo.ac)return;bo.at++;let dx=P.x-bo.x,dy=P.y-bo.y,d=Math.sqrt(dx*dx+dy*dy);if(d>80){bo.vx=dx/d*2.5;bo.vy=dy/d*1.5;bo.x+=bo.vx;bo.y+=bo.vy}if(bo.ph==1){if(bo.at>=bo.ac){bo.at=0;let n=bo.ty=='sw'?7:bo.ty=='bb'?10:5;for(let i=0;i<n;i++)pr.push({x:bo.x,y:bo.y+bo.h/2,vx:Math.sign(dx)*5-i,vy:Math.sin(i*1.5)*3,w:12,h:12,c:bo.ty=='bb'?'#F0F':'#F50',fe:true,life:150})}if(bo.hp<=bo.mh/2){bo.ph=2;bo.ac=20}}else{if(bo.at>=bo.ac){bo.at=0;let n=bo.ty=='bb'?15:10;for(let i=0;i<n;i++)pr.push({x:bo.x,y:bo.y+bo.h/2,vx:Math.sign(dx)*8-i*.5,vy:(i-n/2)*2,w:10,h:10,c:bo.ty=='bb'?'#F00':'#F60',fe:true,life:120})}}if(bo.x<100)bo.x=100;if(bo.x>lw-100)bo.x=lw-100;if(bo.y<100)bo.y=100;if(bo.y>400)bo.y=400;if(bo.hp<=0){bo.ac=false;coins+=100;saveGame();cl__()}}
function up(){for(let i=pr.length-1;i>=0;i--){let p=pr[i];p.x+=p.vx;p.y+=p.vy;if(p.life!==undefined){p.life--;if(p.life<=0){pr.splice(i,1);continue}}if(p.x<-50||p.x>lw+50||p.y<-50||p.y>550){pr.splice(i,1);continue}if(p.fe&&col(p,P)){dp(10);pr.splice(i,1)}}}
function cc(){if(P.ad>0){let r=P.au?55:35,b={x:P.f>0?P.x+P.w:P.x-r,y:P.y,w:r,h:P.h};for(let e of en)if(e.ac&&col(b,e)){e.hp-=P.au?35:20;if(e.hp<=0){e.ac=false;coins+=10}}if(bo&&bo.ac&&col(b,bo)){bo.hp-=P.au?15:8}}for(let c of cl)if(!c.c&&col(P,{x:c.x-8,y:c.y-8,w:16,h:16})){c.c=true;coins+=5;tc+=5;lC+=5}for(let c of bcl)if(!c.c&&col(P,{x:c.x-10,y:c.y-10,w:20,h:20})){c.c=true;bc++;tb++;coins+=20;lB++}for(let h of hp)if(!h.c&&col(P,{x:h.x-8,y:h.y-8,w:16,h:16})){h.c=true;P.hp=Math.min(P.hp+25,P.mh)}for(let e of en)if(e.ac&&col(P,e)&&e.kn<=0){dp(e.ty=='cf'?20:12);e.kn=10}}
function cl__(){S='lc';saveGame();document.getElementById('ls').textContent=`Coins: ${lC} | Bonus: ${lB}/3`;document.getElementById('lc').style.display='block';setTimeout(()=>{document.getElementById('lc').style.display='none';if(L==10&&tb>=30){L=11;mk(11)}else if(L<10){L++;mk(L)}else if(L==11){gc()}},2000)}
function gc(){saveGame();alert(`${t('cm')}\n\n${t('tc')}: ${tc}\n${t('bn')}: ${tb}\n${t('dt')}: ${deaths}`);localStorage.removeItem('cmsave');localStorage.removeItem('cmcuts');setTimeout(()=>{location.reload()},2000)}
function dp(a){if(P.i>0)return;P.hp-=a;P.i=30;if(P.hp<=0){deaths++;mk(L)}}
function col(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function dr(){X.clearRect(0,0,W,H);let g=X.createLinearGradient(0,0,0,H);if(L>=8){g.addColorStop(0,'#1a0a2e');g.addColorStop(1,'#4a2060')}else if(L>=5){g.addColorStop(0,'#F66');g.addColorStop(1,'#FD0')}else{g.addColorStop(0,'#4A90E2');g.addColorStop(1,'#90EE90')}X.fillStyle=g;X.fillRect(0,0,W,H);X.save();X.translate(-cx,0);
for(let l of bg){let sx=l.x-cx*l.s;if(sx<-200||sx>W+200)continue;if(l.ty=='m'){X.fillStyle=l.co;X.beginPath();X.moveTo(sx,l.y+l.h);X.lineTo(sx+l.w/2,l.y);X.lineTo(sx+l.w,l.y+l.h);X.fill();X.fillStyle='rgba(255,255,255,.5)';X.beginPath();X.moveTo(sx+l.w/2-20,l.y+20);X.lineTo(sx+l.w/2,l.y);X.lineTo(sx+l.w/2+20,l.y+20);X.fill()}else{X.fillStyle='#654321';X.fillRect(sx+10,l.y+30,8,30);X.fillStyle=l.co;X.beginPath();X.arc(sx+14,l.y+20,20,0,Math.PI*2);X.fill()}}
for(let p of pf){if(p.x<cx-100||p.x>cx+W+100)continue;if(p.t=='g'){X.fillStyle='#8B4513';X.fillRect(p.x,p.y,p.w,p.h);X.fillStyle='#228B22';X.fillRect(p.x,p.y,p.w,8)}else{X.fillStyle='#D2691E';X.fillRect(p.x,p.y,p.w,p.h);X.fillStyle='#90EE90';X.fillRect(p.x,p.y,p.w,3)}}
if(!bo){X.fillStyle='#888';X.fillRect(gx,250,5,200);X.fillStyle='#FFD700';X.beginPath();X.moveTo(gx+5,250);X.lineTo(gx+50,260);X.lineTo(gx+5,280);X.fill();X.fillStyle='#F00';X.font='bold 22px Arial';X.fillText('GOAL',gx-25,240)}
for(let c of cl){if(c.c||c.x<cx-20||c.x>cx+W+20)continue;let by=Math.sin(tt*.05+c.x)*5;X.fillStyle='#FFD700';X.beginPath();X.arc(c.x,c.y+by,8,0,Math.PI*2);X.fill()}
for(let c of bcl){if(c.c||c.x<cx-30||c.x>cx+W+30)continue;let by=Math.sin(tt*.08+c.x)*8;X.fillStyle='#FFD700';X.beginPath();for(let i=0;i<5;i++){let an=i*4*Math.PI/5-Math.PI/2,x=c.x+Math.cos(an)*12,y=c.y+by+Math.sin(an)*12;if(i==0)X.moveTo(x,y);else X.lineTo(x,y)}X.closePath();X.fill()}
for(let h of hp){if(h.c||h.x<cx-20||h.x>cx+W+20)continue;X.fillStyle='#F00';X.fillRect(h.x-5,h.y-5,10,10);X.fillStyle='#FFF';X.fillRect(h.x-2,h.y-5,4,10);X.fillRect(h.x-5,h.y-2,10,4)}
for(let e of en){if(!e.ac||e.x<cx-50||e.x>cx+W+50)continue;X.fillStyle=e.c;X.fillRect(e.x,e.y,e.w,e.h);if(e.ty=='robot'){X.fillStyle='#0F0';X.fillRect(e.x+8,e.y-8,6,6);X.fillRect(e.x+e.w-14,e.y-8,6,6)}else if(e.ty=='boar'){X.fillStyle='#FFF';X.fillRect(e.x+e.w-4,e.y+5,6,3)}else if(e.ty=='cf'){X.fillStyle='#F00';X.fillRect(e.x+10,e.y,8,8);X.fillRect(e.x+e.w-18,e.y,8,8)}}
if(bo&&bo.ac&&bo.x>=cx-100&&bo.x<=cx+W+100){X.fillStyle='#800080';X.fillRect(bo.x,bo.y,bo.w,bo.h);X.fillStyle='#FF4500';X.beginPath();X.moveTo(bo.x-10,bo.y);X.lineTo(bo.x+bo.w/2,bo.y-50);X.lineTo(bo.x+bo.w+10,bo.y);X.fill();X.fillStyle='#F00';X.fillRect(bo.x+15,bo.y+20,8,8);X.fillRect(bo.x+bo.w-23,bo.y+20,8,8);if(bo.ph==2){X.fillStyle='rgba(255,0,0,.4)';X.beginPath();X.arc(bo.x+bo.w/2,bo.y+bo.h/2,50,0,Math.PI*2);X.fill()}}
X.fillStyle='#4A90E2';X.fillRect(P.x,P.y+15,P.w,P.h-15);X.fillStyle='#FFD2B3';X.beginPath();X.arc(P.x+P.w/2,P.y+10,15,0,Math.PI*2);X.fill();X.fillStyle='#8B4513';X.beginPath();X.ellipse(P.x+P.w/2,P.y+3,18,5,0,0,Math.PI*2);X.fill();X.fillRect(P.x+P.w/2-10,P.y-8,20,12);X.fillStyle='#000';X.fillRect(P.x+P.w/2+P.f*8,P.y+8,3,3);X.fillRect(P.x+P.w/2+P.f*13,P.y+8,3,3);
for(let p of pr){X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,p.w/2,0,Math.PI*2);X.fill()}
X.restore();X.fillStyle='#000';X.font='bold 16px Arial';X.fillText(`${t('lv')} ${L}`,10,25);if(bo&&bo.ac){X.fillStyle='#000';X.fillRect(W/2-102,38,204,19);X.fillStyle='#F00';X.fillRect(W/2-100,40,200*(bo.hp/bo.mh),15)}}

function loop(){if(!running)return;if(S=='playing'){upd()}dr();document.getElementById('hp').style.width=(P.hp/P.mh*100)+'%';document.getElementById('cc').textContent=coins;document.getElementById('bc').textContent=`${lB}/3`;document.getElementById('lv').textContent=`${t('lv')} ${L}`;animId=requestAnimationFrame(loop)}

function setup(){const c={'l':'left','r':'right','j':'jump','a':'attack'};for(let id in c){const el=document.getElementById(id);const ac=c[id];el.addEventListener('touchstart',function(e){e.preventDefault();I[ac]=true});el.addEventListener('touchend',function(e){e.preventDefault();I[ac]=false});el.addEventListener('mousedown',function(){I[ac]=true});el.addEventListener('mouseup',function(){I[ac]=false});el.addEventListener('mouseleave',function(){I[ac]=false})}}

gameInstance={stop:stop};
setup();mk(L);loop();
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
