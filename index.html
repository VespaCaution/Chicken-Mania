<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🐔 Chicken Mania</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a0a00">
<link rel="icon" href="icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:#1a0a00;display:flex;justify-content:center;align-items:center;height:100vh;font-family:'Comic Sans MS',Arial,sans-serif;overflow:hidden;touch-action:none}
#app{width:100%;max-width:500px;height:100vh;max-height:750px;position:relative}
#ss{width:100%;height:100%;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#4A90E2,#87CEEB 30%,#90EE90 60%,#228B22);text-align:center;position:relative;flex-direction:column;overflow:hidden}
#ss::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.3),transparent 50%),radial-gradient(circle at 70% 80%,rgba(255,255,255,.2),transparent 50%)}
.gt{font-size:48px;color:#FFD700;text-shadow:3px 3px 6px rgba(0,0,0,.5),0 0 20px rgba(255,215,0,.5);animation:b 2s infinite;position:relative;z-index:10}
@keyframes b{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
.gs{font-size:18px;color:#fff;margin:10px 0 20px;text-shadow:2px 2px 4px rgba(0,0,0,.5);position:relative;z-index:10}
.ls{display:flex;gap:10px;justify-content:center;margin-bottom:20px;position:relative;z-index:10}
.lb{padding:10px 20px;border:2px solid #FFD700;background:rgba(255,255,255,.2);color:#fff;border-radius:25px;cursor:pointer;font-size:16px;transition:all .3s}
.lb.ac{background:#FFD700;color:#333;font-weight:bold;box-shadow:0 0 15px rgba(255,215,0,.5)}
.sb{padding:18px 35px;font-size:22px;background:linear-gradient(145deg,#FFD700,#FFA500);border:3px solid #fff;border-radius:50px;cursor:pointer;font-weight:bold;color:#333;box-shadow:0 6px 12px rgba(0,0,0,.3);transition:all .3s;position:relative;z-index:10;display:block;margin:5px auto}
.sb:active{transform:scale(.95)}
.ib{padding:12px 25px;font-size:14px;background:linear-gradient(145deg,#4CAF50,#2E7D32);border:2px solid #fff;border-radius:25px;cursor:pointer;font-weight:bold;color:#fff;box-shadow:0 4px 8px rgba(0,0,0,.3);display:none;margin:5px auto;position:relative;z-index:10}
.rb{padding:10px 25px;font-size:14px;background:rgba(255,0,0,.3);border:2px solid #f44;border-radius:25px;cursor:pointer;font-weight:bold;color:#fff;margin-top:10px;display:none;position:relative;z-index:10}
.vr{margin-top:15px;color:rgba(255,255,255,.7);font-size:12px;position:relative;z-index:10}
#gs{width:100%;height:100%;display:none}
#w{position:relative;width:100%;height:100%;display:flex;flex-direction:column}
#c{width:100%;flex:1;background:#87CEEB;touch-action:none;border-bottom:3px solid #8B4513}
#t{background:linear-gradient(180deg,#2a1508,#1a0a00);padding:8px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #FFD700;min-height:40px}
#b{background:linear-gradient(0deg,#2a1508,#1a0a00);padding:10px;display:flex;justify-content:space-between;gap:10px;min-height:80px;border-top:2px solid #FFD700}
.h{display:flex;align-items:center;gap:5px;color:#fff;font-weight:bold;font-size:14px;background:rgba(0,0,0,.5);padding:5px 10px;border-radius:15px;border:2px solid rgba(255,215,0,.5)}
.g{display:flex;gap:8px}
.btn{width:55px;height:55px;border-radius:50%;border:3px solid #FFD700;background:linear-gradient(145deg,rgba(255,215,0,.4),rgba(255,215,0,.2));color:#fff;font-size:22px;display:flex;justify-content:center;align-items:center;cursor:pointer;box-shadow:0 4px 8px rgba(0,0,0,.3);pointer-events:auto}
.btn:active{transform:scale(.9)}
#j{background:linear-gradient(145deg,rgba(0,255,0,.4),rgba(0,255,0,.2));border-color:#0f0}
#a{background:linear-gradient(145deg,rgba(255,0,0,.4),rgba(255,0,0,.2));border-color:#f44}
#cs{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.95);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:100;padding:20px}
#lc{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.9);color:#FFD700;padding:20px;border-radius:15px;text-align:center;display:none;z-index:90;border:3px solid #FFD700}
</style>
</head>
<body>
<div id="app">
<div id="ss">
<h1 class="gt">🐔 Chicken Mania</h1>
<p class="gs" id="st">A Farm Adventure</p>
<div class="ls"><button class="lb ac" id="le" onclick="sl('en')">🇬🇧 English</button><button class="lb" id="lf" onclick="sl('fr')">🇫🇷 Français</button></div>
<button class="sb" id="sb" onclick="sg()">▶️ Start Game</button>
<button class="ib" id="ib" onclick="installApp()">📲 Install App</button>
<button class="rb" id="rb" onclick="rg()">🔄 Restart Game</button>
<p class="vr">v1.5.0</p>
</div>
<div id="gs">
<div id="w">
<div id="t">
<div class="h"><span>❤️</span><div style="width:80px;height:12px;background:#333;border-radius:6px;overflow:hidden;border:1px solid #fff"><div id="hp" style="width:100%;height:100%;background:linear-gradient(90deg,#f44,#f66);transition:width .3s"></div></div></div>
<div class="h"><span>🪙</span><span id="cc">0</span></div>
<div class="h"><span>⭐</span><span id="bc">0/3</span></div>
<div class="h"><span>🏆</span><span id="lv">Lv 1</span></div>
</div>
<canvas id="c" width="500" height="500"></canvas>
<div id="b">
<div class="g"><div class="btn" id="l">⬅️</div><div class="btn" id="r">➡️</div></div>
<div class="g"><div class="btn" id="j">⬆️</div><div class="btn" id="a">⚔️</div></div>
</div>
<div id="cs"><div id="cp" style="font-size:80px">👨‍🌾</div><div id="ct" style="color:#FFD700;font-size:20px;text-align:center;margin:20px"></div><button onclick="skipCutscene()" style="background:#FFD700;border:none;padding:15px 40px;border-radius:25px;font-weight:bold;font-size:18px;cursor:pointer;pointer-events:auto;z-index:101" id="skb">Skip ⏭️</button></div>
<div id="lc"><h2>🎉 Complete!</h2><p id="ls"></p></div>
</div>
</div>
</div>
<script>
// ==== GLOBAL FUNCTIONS ====
let globalSkipFn=null;
function skipCutscene(){if(globalSkipFn)globalSkipFn()}
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;document.getElementById('ib').style.display='block'});
function installApp(){if(deferredPrompt){deferredPrompt.prompt()}else{alert('Open in Chrome → Menu → "Add to Home Screen"')}}
window.addEventListener('appinstalled',()=>{document.getElementById('ib').style.display='none';deferredPrompt=null});

// ==== TRANSLATIONS ====
const T={en:{st:'A Farm Adventure',sb:'▶️ Start Game',rb:'🔄 Restart Game',lv:'Level',sk:'Skip ⏭️',cm:'🎉 CONGRATULATIONS! 🎉',tc:'Total Coins',bn:'Bonus Coins',dt:'Deaths',tm:'Time'},fr:{st:'Une Aventure à la Ferme',sb:'▶️ Commencer',rb:'🔄 Recommencer',lv:'Niveau',sk:'Passer ⏭️',cm:'🎉 FÉLICITATIONS ! 🎉',tc:'Pièces Totales',bn:'Pièces Bonus',dt:'Morts',tm:'Temps'}};
let Lg=localStorage.getItem('cml')||'en';
function sl(l){Lg=l;document.getElementById('st').textContent=T[l].st;document.getElementById('sb').textContent=T[l].sb;document.getElementById('rb').textContent=T[l].rb;document.getElementById('le').classList.toggle('ac',l=='en');document.getElementById('lf').classList.toggle('ac',l=='fr');document.getElementById('skb').textContent=T[l].sk;localStorage.setItem('cml',l)}
function t(k){return T[Lg][k]||k}
sl(Lg);
if(localStorage.getItem('cmsave')){document.getElementById('rb').style.display='block';document.getElementById('sb').textContent='▶️ '+(Lg=='en'?'Continue':'Continuer')}

// ==== GAME STATE ====
let gameInstance=null;
function sg(){document.getElementById('ss').style.display='none';document.getElementById('gs').style.display='block';startGame()}
function rg(){if(confirm(Lg=='en'?'Restart from beginning?':'Recommencer ?')){localStorage.removeItem('cmsave');localStorage.removeItem('cmcuts');location.reload()}}

function startGame(){
if(gameInstance){gameInstance.stop();gameInstance=null}
const C=document.getElementById('c'),X=C.getContext('2d'),W=500,H=500;
let running=true,animId=null,skipTimer=null;
let S='playing',L=1,coins=0,tc=0,bc=0,tb=0,deaths=0,tt=0,lt=0,ci=0,cs=[],lC=0,lB=0,cutscenesShown=JSON.parse(localStorage.getItem('cmcuts')||'{}');
const P={x:50,y:350,w:35,h:45,vx:0,vy:0,s:5,j:-12,hp:100,mh:100,ac:0,ad:0,f:1,g:false,i:0,dj:true,dja:true,au:false,su:false};
const I={left:false,right:false,jump:false,attack:false};
let pf=[],en=[],cl=[],bcl=[],hp=[],pr=[],pa=[],de=[],bo=null,cx=0,lw=0,gx=0,bg=[],fg=[],we=[];
const save=JSON.parse(localStorage.getItem('cmsave')||'null');
if(save){L=save.L||1;coins=save.coins||0;tc=save.tc||0;bc=save.bc||0;tb=save.tb||0;deaths=save.deaths||0;tt=save.tt||0}

// ==== CUTSCENES ====
const cuts={1:[['👨‍🌾',Lg=='fr'?'Fermier Joe : Quelle belle matinée !':'Farmer Joe: What a morning!'],['🐔',Lg=='fr'?'Poulet : Quelque chose ne va pas...':'Chicken: Something is wrong...'],['🐗',Lg=='fr'?'Un sanglier sauvage apparaît !':'A wild boar appears!'],['👨‍🌾',Lg=='fr'?'Je dois protéger la ferme !':'I must protect the farm!']],3:[['🧙',Lg=='fr'?'Sorcier : J\'ai corrompu ta ferme !':'Wizard: I corrupted your farm!'],['👨‍🌾',Lg=='fr'?'Tu ne gagneras pas !':'You will not win!']],5:[['👨‍🌾',Lg=='fr'?'La corruption se propage...':'The corruption spreads...'],['🐔',Lg=='fr'?'Nous devons sauver les animaux !':'We must save the animals!']],7:[['🧙',Lg=='fr'?'Tu es plus fort que je pensais !':'You are stronger than I thought!'],['👨‍🌾',Lg=='fr'?'Je n\'abandonnerai jamais !':'I will never give up!']],10:[['🔥',Lg=='fr'?'La Bataille Finale !':'The Final Battle!'],['🧙',Lg=='fr'?'IL EST TEMPS D\'EN FINIR !':'TIME TO END THIS!']],11:[['🎉',Lg=='fr'?'NIVEAU BONUS !':'BONUS LEVEL!'],['👨‍🌾',Lg=='fr'?'Tu as collecté toutes les pièces bonus !':'You collected all bonus coins!']]};

// ==== FUNCTIONS ====
function stop(){running=false;if(animId)cancelAnimationFrame(animId);if(skipTimer)clearTimeout(skipTimer);globalSkipFn=null;document.getElementById('cs').style.display='none'}
function saveGame(){localStorage.setItem('cmsave',JSON.stringify({L:L,coins:coins,tc:tc,bc:bc,tb:tb,deaths:deaths,tt:tt}))}
function mke(x,y,ty){const e={boar:{w:40,h:30,hp:40,s:3,c:'#8B4513'},crow:{w:30,h:30,hp:25,s:3.5,c:'#333'},robot:{w:35,h:40,hp:50,s:2,c:'#808080'},cf:{w:45,h:50,hp:80,s:1.5,c:'#556B2F'}}[ty];return{x:x,y:y-e.h,w:e.w,h:e.h,hp:e.hp,mh:e.hp,s:e.s,c:e.c,ty:ty,vx:e.s,vy:0,ac:true,at:0,acd:60,og:false,kb:0,kn:0}}
function col(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function dp(a){if(P.i>0)return;P.hp-=a;P.i=30;if(P.hp<=0){deaths++;mk(L);return}}

// ==== LEVEL GENERATION ====
function mk(L){
pf=[];en=[];cl=[];bcl=[];hp=[];pr=[];pa=[];de=[];bg=[];fg=[];we=[];bo=null;cx=0;lt=0;lC=0;lB=0;
Object.assign(P,{x:50,y:350,vx:0,vy:0,hp:100,i:0,dj:true,dja:true,au:L>=5,su:L>=7});
lw=2000+L*400;gx=lw-150;
const isBoss=(L==3||L==7||L==10||L==11);
if(isBoss){
for(let i=0;i<lw;i+=50)pf.push({x:i,y:450,w:50,h:50,t:'g'});
for(let i=0;i<3;i++)pf.push({x:300+i*200,y:350,w:80,h:15,t:'f'});
if(L==3||L==7)bo={x:lw-300,y:350,w:55,h:80,hp:150+L*30,mh:150+L*30,ph:1,at:0,ac:60,ac:true,ty:'w'};
else if(L==10)bo={x:lw-300,y:330,w:60,h:90,hp:400,mh:400,ph:1,at:0,ac:40,ac:true,ty:'sw'};
else bo={x:lw-300,y:310,w:70,h:100,hp:600,mh:600,ph:1,at:0,ac:25,ac:true,ty:'bb'};
}else{
if(L%3==1){for(let i=0;i<lw;i+=50){if(i>400&&i<500)continue;if(i>1200&&i<1350)continue;if(i>lw/2&&i<lw/2+150)continue;pf.push({x:i,y:450,w:50,h:50,t:'g'})}pf.push({x:400,y:380,w:100,h:15,t:'f'});pf.push({x:1200,y:360,w:100,h:15,t:'f'});pf.push({x:lw/2,y:370,w:100,h:15,t:'f'})}
else if(L%3==2){for(let i=0;i<lw;i+=50)pf.push({x:i,y:450,w:50,h:50,t:'g'});for(let i=0;i<8;i++)pf.push({x:300+i*100,y:400-i*20,w:80,h:15,t:'f'});for(let i=0;i<8;i++)pf.push({x:1100+i*100,y:300+i*20,w:80,h:15,t:'f'})}
else{for(let i=0;i<lw;i+=50){if(i>600&&i<750)continue;if(i>1500&&i<1700)continue;pf.push({x:i,y:450,w:50,h:50,t:'g'})}pf.push({x:600,y:380,w:150,h:15,t:'f'});pf.push({x:1500,y:350,w:150,h:15,t:'f'})}
for(let i=0;i<5+L;i++){let x=500+i*(lw/(5+L));if(x>350&&x<550)continue;let ty=['boar','robot','boar','cf','boar'][i%5];if(L>3&&i%3==0)en.push(mke(x,430,'robot'));else if(L>5&&i%4==0)en.push(mke(x,430,'cf'));else en.push(mke(x,430,ty))}
for(let i=0;i<Math.min(2,Math.floor(L/3));i++)en.push(mke(600+i*300,250,'crow'));
}
for(let i=0;i<10+L*2;i++)cl.push({x:200+i*(lw/(10+L*2)),y:380-(i%4)*40,c:false});
for(let i=0;i<3;i++)bcl.push({x:500+i*(lw/4),y:300-i*20,c:false});
for(let i=0;i<Math.floor(L/3);i++)hp.push({x:500+i*(lw/Math.floor(L/3)),y:420,c:false});
for(let i=0;i<20;i++)bg.push({x:i*150,y:200+Math.random()*150,w:250,h:250,ty:'m',co:`hsl(${200+L*8},30%,${35+L*3}%)`,s:.2});
for(let i=0;i<25;i++)bg.push({x:i*100+50,y:380,w:30,h:50,ty:'t',co:`hsl(${110+Math.random()*30},40%,${25+Math.random()*20}%)`,s:.3});
for(let i=0;i<30;i++)fg.push({x:i*70+30,y:448,w:15,h:5,ty:'g',co:'#228B22',s:.8});
if(L>=8)for(let i=0;i<50;i++)we.push({x:Math.random()*W,y:Math.random()*H,vx:Math.random()*2-1,vy:Math.random()*3+2,ty:L>=10?'e':'r',li:Math.random()*100});
if(cuts[L]&&!cutscenesShown[L]){cutscenesShown[L]=true;localStorage.setItem('cmcuts',JSON.stringify(cutscenesShown));cs=cuts[L];ci=0;S='cutscene';document.getElementById('cs').style.display='flex';showCuts()}else S='playing';
saveGame();
}

// ==== CUTSCENE DISPLAY ====
function showCuts(){globalSkipFn=skipCuts;if(ci<cs.length){document.getElementById('cp').textContent=cs[ci][0];document.getElementById('ct').textContent=cs[ci][1];ci++;skipTimer=setTimeout(()=>{if(S=='cutscene'&&running)showCuts()},2500)}else{skipCuts()}}
function skipCuts(){if(skipTimer){clearTimeout(skipTimer);skipTimer=null}document.getElementById('cs').style.display='none';S='playing';globalSkipFn=null}

// ==== UPDATE ====
function upd(){if(!running||S!='playing')return;lt++;tt++;
if(I.left){P.vx=-P.s;P.f=-1}else if(I.right){P.vx=P.s;P.f=1}else P.vx=0;
if(I.jump){if(P.g){P.vy=P.j;P.g=false;P.dja=true;I.jump=false}else if(P.dj&&P.dja){P.vy=P.j*.8;P.dja=false;I.jump=false;jp()}}
if(I.attack&&P.ac<=0){P.ac=15;P.ad=8}
if(P.ac>0)P.ac--;if(P.ad>0)P.ad--;
P.vy+=.6;if(P.vy>15)P.vy=15;P.x+=P.vx;P.y+=P.vy;P.g=false;
for(let p of pf)if(col(P,p)){if(P.vy>0&&P.y-P.vy+P.h<=p.y+10){P.y=p.y-P.h;P.vy=0;P.g=true}}
if(P.x<0)P.x=0;if(P.x>lw-P.w)P.x=lw-P.w;
if(P.y>500||P.hp<=0){deaths++;mk(L);return}
if(P.i>0)P.i--;
ue();if(bo&&bo.ac)ub();up();cc();cx=Math.max(0,Math.min(P.x-W/2,lw-W));
if(bo&&bo.ac&&bo.hp<=0){cl__();return}
if(!bo&&P.x>=gx)cl__();
}
function ue(){for(let e of en){if(!e.ac)continue;if(e.kn>0)e.kn--;if(e.ty=='boar'){e.x+=e.vx;if(e.x<50||e.x>lw-50)e.vx*=-1;let dx=P.x-e.x;if(Math.abs(dx)<200&&Math.abs(P.y-e.y)<80)e.vx=Math.sign(dx)*6;else e.vx=Math.sign(e.vx)*e.s}else if(e.ty=='crow'){let dx=P.x-e.x,dy=P.y-e.y,d=Math.sqrt(dx*dx+dy*dy);if(d>60){e.vx=dx/d*e.s;e.vy=dy/d*e.s}}else if(e.ty=='robot'){let dx=P.x-e.x;if(Math.abs(dx)>120)e.vx=Math.sign(dx)*e.s;else{e.vx=0;e.at++;if(e.at>=e.acd){e.at=0;pr.push({x:e.x,y:e.y+e.h/2,vx:Math.sign(dx)*7,vy:0,w:8,h:5,c:'#F00',fe:true,life:120})}}}else if(e.ty=='cf'){let dx=P.x-e.x;if(Math.abs(dx)>60)e.vx=Math.sign(dx)*e.s;else{e.vx=0;e.at++;if(e.at>=40){e.at=0;if(Math.abs(P.y-e.y)<50)dp(20)}}}e.x+=e.vx;e.y+=e.vy;if(e.ty!='crow'){e.og=false;for(let p of pf){if(p.t=='g'&&col(e,p)){if(e.vy>0&&e.y+e.h-p.y<20){e.y=p.y-e.h;e.vy=0;e.og=true}}}if(!e.og){e.vy+=.5}else{e.vy=0}if(e.y>440){e.y=440-e.h;e.vy=0;e.og=true}}}}
function ub(){if(!bo||!bo.ac)return;bo.at++;let dx=P.x-bo.x,dy=P.y-bo.y,d=Math.sqrt(dx*dx+dy*dy);if(d>80){bo.vx=dx/d*2.5;bo.vy=dy/d*1.5;bo.x+=bo.vx;bo.y+=bo.vy}if(bo.ph==1){if(bo.at>=bo.ac){bo.at=0;let n=bo.ty=='sw'?7:bo.ty=='bb'?10:5;for(let i=0;i<n;i++)pr.push({x:bo.x,y:bo.y+bo.h/2,vx:Math.sign(dx)*5-i,vy:Math.sin(i*1.5)*3,w:12,h:12,c:bo.ty=='bb'?'#F0F':'#F50',fe:true,life:150})}if(bo.hp<=bo.mh/2){bo.ph=2;bo.ac=20;bp()}}else{if(bo.at>=bo.ac){bo.at=0;let n=bo.ty=='bb'?15:10;for(let i=0;i<n;i++)pr.push({x:bo.x,y:bo.y+bo.h/2,vx:Math.sign(dx)*8-i*.5,vy:(i-n/2)*2,w:10,h:10,c:bo.ty=='bb'?'#F00':'#F60',fe:true,life:120})}}if(bo.x<100)bo.x=100;if(bo.x>lw-100)bo.x=lw-100;if(bo.y<100)bo.y=100;if(bo.y>400)bo.y=400;if(bo.hp<=0){bo.ac=false;coins+=100;saveGame();cl__()}}
function up(){for(let i=pr.length-1;i>=0;i--){let p=pr[i];p.x+=p.vx;p.y+=p.vy;if(p.life!==undefined){p.life--;if(p.life<=0){pr.splice(i,1);continue}}if(p.x<-50||p.x>lw+50||p.y<-50||p.y>550){pr.splice(i,1);continue}if(p.fe&&col(p,P)){dp(10);pr.splice(i,1)}}}
