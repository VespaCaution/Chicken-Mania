<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:#1a0a00;display:flex;justify-content:center;align-items:center;height:100vh;font-family:'Comic Sans MS',Arial,sans-serif;overflow:hidden;touch-action:none}
#app{width:100%;max-width:500px;height:100vh;max-height:750px;position:relative}
#ss{width:100%;height:100%;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#4A90E2,#87CEEB 30%,#90EE90 60%,#228B22);text-align:center;position:relative;flex-direction:column;overflow:hidden}
.gt{font-size:48px;color:#FFD700;text-shadow:3px 3px 6px rgba(0,0,0,.5),0 0 20px rgba(255,215,0,.5);animation:b 2s infinite;position:relative;z-index:10}
@keyframes b{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
.gs{font-size:18px;color:#fff;margin:10px 0 20px;position:relative;z-index:10}
.ls{display:flex;gap:10px;justify-content:center;margin-bottom:20px;position:relative;z-index:10}
.lb{padding:10px 20px;border:2px solid #FFD700;background:rgba(255,255,255,.2);color:#fff;border-radius:25px;cursor:pointer;font-size:16px;pointer-events:auto}
.lb.ac{background:#FFD700;color:#333;font-weight:bold}
.sb{padding:18px 35px;font-size:22px;background:#FFD700;border:3px solid #fff;border-radius:50px;cursor:pointer;font-weight:bold;color:#333;display:block;margin:5px auto;pointer-events:auto;position:relative;z-index:10}
.ib{padding:12px 25px;font-size:14px;background:#4CAF50;border:2px solid #fff;border-radius:25px;cursor:pointer;font-weight:bold;color:#fff;display:none;margin:5px auto;pointer-events:auto;position:relative;z-index:10}
.rb{padding:10px 25px;font-size:14px;background:rgba(255,0,0,.3);border:2px solid #f44;border-radius:25px;cursor:pointer;font-weight:bold;color:#fff;margin-top:10px;display:none;pointer-events:auto;position:relative;z-index:10}
.vr{margin-top:15px;color:rgba(255,255,255,.7);font-size:12px;position:relative;z-index:10}
#gs{width:100%;height:100%;display:none}
#w{position:relative;width:100%;height:100%;display:flex;flex-direction:column}
#c{width:100%;flex:1;background:#87CEEB;touch-action:none;border-bottom:3px solid #8B4513;position:relative}
#t{background:#2a1508;padding:8px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #FFD700;min-height:40px}
#b{background:#2a1508;padding:10px;display:flex;justify-content:space-between;gap:10px;min-height:100px;border-top:2px solid #FFD700}
.h{display:flex;align-items:center;gap:5px;color:#fff;font-weight:bold;font-size:14px;background:rgba(0,0,0,.5);padding:5px 10px;border-radius:15px;border:2px solid rgba(255,215,0,.5)}
.g{display:flex;gap:5px}
.btn{width:45px;height:45px;border-radius:50%;border:2px solid #FFD700;background:rgba(255,215,0,.3);color:#fff;font-size:18px;display:flex;justify-content:center;align-items:center;cursor:pointer;pointer-events:auto;touch-action:none}
.btn:active{transform:scale(.9)}
#j{background:rgba(0,255,0,.3);border-color:#0f0}
#a{background:rgba(255,0,0,.3);border-color:#f44}
#cs{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.95);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:100;padding:20px}
#lc{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.9);color:#FFD700;padding:20px;border-radius:15px;text-align:center;display:none;z-index:90;border:3px solid #FFD700}
.dpad{display:grid;grid-template-columns:45px 45px 45px;grid-template-rows:45px 45px 45px;gap:3px}
.dpad .btn{width:45px;height:45px;font-size:16px}
</style>
</head>
<body>
<div id="app">
<div id="ss">
<h1 class="gt">🐔 Chicken Mania</h1>
<p class="gs" id="st">A Farm Adventure</p>
<div class="ls">
<button class="lb ac" id="le" style="pointer-events:auto" onclick="setLang('en')">🇬🇧 English</button>
<button class="lb" id="lf" style="pointer-events:auto" onclick="setLang('fr')">🇫🇷 Français</button>
</div>
<button class="sb" id="sb" style="pointer-events:auto" onclick="startGameBtn()">▶️ Start Game</button>

</div>
<div id="gs">
<div id="w">
<div id="t">
<div class="h"><span>❤️</span><div style="width:80px;height:12px;background:#333;border-radius:6px;overflow:hidden;border:1px solid #fff"><div id="hp" style="width:100%;height:100%;background:linear-gradient(90deg,#f44,#f66)"></div></div></div>
<div class="h"><span>🪙</span><span id="cc">0</span></div>
<div class="h"><span>⭐</span><span id="bc">0/3</span></div>
<div class="h"><span>🏆</span><span id="lv">Lv 1</span></div>
</div>
<div id="c"></div>
<div id="b">
<div class="dpad">
<div></div>
<div class="btn" id="fw" style="pointer-events:auto;touch-action:none">⬆️</div>
<div></div>
<div class="btn" id="l" style="pointer-events:auto;touch-action:none">⬅️</div>
<div class="btn" id="j" style="pointer-events:auto;touch-action:none">🦘</div>
<div class="btn" id="r" style="pointer-events:auto;touch-action:none">➡️</div>
<div></div>
<div class="btn" id="bw" style="pointer-events:auto;touch-action:none">⬇️</div>
<div></div>
</div>
<div class="g">
<div class="btn" id="a" style="pointer-events:auto;touch-action:none;width:60px;height:60px;font-size:24px">⚔️</div>
</div>
</div>
<div id="cs"><div id="cp" style="font-size:80px">👨‍🌾</div><div id="ct" style="color:#FFD700;font-size:20px;text-align:center;margin:20px"></div><button onclick="skipCutscene()" style="background:#FFD700;border:none;padding:15px 40px;border-radius:25px;font-weight:bold;font-size:18px;cursor:pointer;pointer-events:auto;z-index:101" id="skb">Skip ⏭️</button></div>
<div id="lc"><h2>🎉 Complete!</h2><p id="ls"></p></div>
</div>
</div>
</div>
<script>
let globalSkipFn=null,deferredPrompt=null,gameInstance=null,currentLang='en';
function skipCutscene(){if(globalSkipFn){globalSkipFn();globalSkipFn=null;}}
function installApp(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;document.getElementById('ib').style.display='none';}else{alert('To install: Open in Chrome → Menu → "Add to Home Screen"');}}
function startGameBtn(){document.getElementById('ss').style.display='none';document.getElementById('gs').style.display='block';initGame();}
function restartGame(){if(confirm(currentLang=='en'?'Restart from beginning?':'Recommencer ?')){localStorage.removeItem('cmsave');localStorage.removeItem('cmcuts');location.reload();}}
function setLang(l){currentLang=l;document.getElementById('st').textContent=TRANSLATIONS[l].st;document.getElementById('sb').textContent=TRANSLATIONS[l].sb;document.getElementById('rb').textContent=TRANSLATIONS[l].rb;document.getElementById('skb').textContent=TRANSLATIONS[l].sk;document.getElementById('le').classList.toggle('ac',l=='en');document.getElementById('lf').classList.toggle('ac',l=='fr');localStorage.setItem('cml',l);}
function t(key){return TRANSLATIONS[currentLang][key]||key;}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;document.getElementById('ib').style.display='block';});
window.addEventListener('appinstalled',function(){deferredPrompt=null;document.getElementById('ib').style.display='none';});
const TRANSLATIONS={en:{st:'A Farm Adventure',sb:'▶️ Start Game',rb:'🔄 Restart Game',lv:'Level',sk:'Skip ⏭️',cm:'🎉 CONGRATULATIONS! 🎉',tc:'Total Coins',bn:'Bonus Coins',dt:'Deaths',tm:'Time',needBonus:'You need all 30 bonus coins!'},fr:{st:'Une Aventure à la Ferme',sb:'▶️ Commencer',rb:'🔄 Recommencer',lv:'Niveau',sk:'Passer ⏭️',cm:'🎉 FÉLICITATIONS ! 🎉',tc:'Pièces Totales',bn:'Pièces Bonus',dt:'Morts',tm:'Temps',needBonus:'Il vous faut 30 pièces bonus !'}};
currentLang=localStorage.getItem('cml')||'en';setLang(currentLang);
if(localStorage.getItem('cmsave')){document.getElementById('rb').style.display='block';document.getElementById('sb').textContent='▶️ '+(currentLang=='en'?'Continue':'Continuer');}

function initGame(){
if(gameInstance){gameInstance.stop();gameInstance=null;}
const container=document.getElementById('c');
const W=container.clientWidth||500,H=container.clientHeight||420;
let running=true,animId=null,skipTimer=null;
let S='playing',L=1,coins=0,tc=0,bc=0,tb=0,deaths=0,tt=0,lt=0,ci=0,cs=[],lC=0,lB=0;
let cutscenesShown=JSON.parse(localStorage.getItem('cmcuts')||'{}');
const I={left:false,right:false,forward:false,backward:false,jump:false,attack:false};
const P={x:0,y:1,z:0,vx:0,vy:0,vz:0,s:0.25,j:0.5,hp:100,mh:100,ac:0,ad:0,f:1,g:false,i:0,dj:false,dja:false,au:false,su:false,attackCombo:0,rotY:0};
let platforms=[],enemies=[],coinList=[],bonusList=[],healthList=[],projectiles=[],particles=[],boss=null,lw=0,gx=0;
const save=JSON.parse(localStorage.getItem('cmsave')||'null');
if(save){L=save.L||1;coins=save.coins||0;tc=save.tc||0;bc=save.bc||0;tb=save.tb||0;deaths=save.deaths||0;tt=save.tt||0;}
const cuts={1:[['👨‍🌾',currentLang=='fr'?'Fermier Joe : Quelle belle matinée !':'Farmer Joe: What a morning!'],['🐔',currentLang=='fr'?'Poulet : Quelque chose ne va pas...':'Chicken: Something is wrong...'],['🐗',currentLang=='fr'?'Un sanglier sauvage apparaît !':'A wild boar appears!'],['👨‍🌾',currentLang=='fr'?'Je dois protéger la ferme !':'I must protect the farm!']],3:[['🧙',currentLang=='fr'?'Sorcier : J\'ai corrompu ta ferme !':'Wizard: I corrupted your farm!'],['👨‍🌾',currentLang=='fr'?'Tu ne gagneras pas !':'You will not win!']],5:[['👨‍🌾',currentLang=='fr'?'La corruption se propage...':'The corruption spreads...'],['🐔',currentLang=='fr'?'Nous devons sauver les animaux !':'We must save the animals!']],7:[['🧙',currentLang=='fr'?'Tu es plus fort que je pensais !':'You are stronger than I thought!'],['👨‍🌾',currentLang=='fr'?'Je n\'abandonnerai jamais !':'I will never give up!']],10:[['🔥',currentLang=='fr'?'La Bataille Finale !':'The Final Battle!'],['🧙',currentLang=='fr'?'IL EST TEMPS D\'EN FINIR !':'TIME TO END THIS!']],11:[['🎉',currentLang=='fr'?'NIVEAU BONUS !':'BONUS LEVEL!'],['👨‍🌾',currentLang=='fr'?'Tu as collecté toutes les pièces bonus !':'You collected all bonus coins!']]};

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87CEEB);
scene.fog=new THREE.Fog(0x87CEEB,30,100);
const camera=new THREE.PerspectiveCamera(50,W/H,0.1,200);
camera.position.set(0,10,20);
camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(W,H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const ambient=new THREE.AmbientLight(0xffffff,0.5);
scene.add(ambient);
const sun=new THREE.DirectionalLight(0xffffff,0.9);
sun.position.set(20,30,10);
sun.castShadow=true;
sun.shadow.camera.left=-40;
sun.shadow.camera.right=40;
sun.shadow.camera.top=40;
sun.shadow.camera.bottom=-40;
sun.shadow.camera.far=100;
sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;
scene.add(sun);
const hemi=new THREE.HemisphereLight(0x87CEEB,0x228B22,0.3);
scene.add(hemi);

const skyGeo=new THREE.SphereGeometry(100,32,32);
const skyMat=new THREE.MeshBasicMaterial({color:0x87CEEB,side:THREE.BackSide});
const sky=new THREE.Mesh(skyGeo,skyMat);
scene.add(sky);

const groundGeo=new THREE.PlaneGeometry(300,300);
const groundMat=new THREE.MeshStandardMaterial({color:0x8B4513,roughness:0.9});
const ground=new THREE.Mesh(groundGeo,groundMat);
ground.rotation.x=-Math.PI/2;
ground.position.y=0;
ground.receiveShadow=true;
scene.add(ground);

function createTree(x,z,far){
const tree=new THREE.Group();
const trunkGeo=new THREE.CylinderGeometry(0.3,0.5,3,8);
const trunkMat=new THREE.MeshStandardMaterial({color:0x654321,roughness:0.9});
const trunk=new THREE.Mesh(trunkGeo,trunkMat);
trunk.position.y=1.5;
tree.add(trunk);
const leafMat=new THREE.MeshStandardMaterial({color:0x228B22,roughness:0.7});
const leaf1=new THREE.Mesh(new THREE.SphereGeometry(far?3:2,8,8),leafMat);
leaf1.position.y=4;
tree.add(leaf1);
tree.position.set(x,0,z);
scene.add(tree);
return tree;
}

function createTorch(x,z){
const torch=new THREE.Group();
const poleGeo=new THREE.CylinderGeometry(0.1,0.15,2,6);
const pole=new THREE.Mesh(poleGeo,new THREE.MeshStandardMaterial({color:0x8B4513}));
pole.position.y=1;
torch.add(pole);
const flameGeo=new THREE.SphereGeometry(0.3,8,8);
const flameMat=new THREE.MeshStandardMaterial({color:0xFF6600,emissive:0xFF4400,emissiveIntensity:2});
const flame=new THREE.Mesh(flameGeo,flameMat);
flame.position.y=2.2;
torch.add(flame);
torch.position.set(x,0,z);
scene.add(torch);
return torch;
}

const playerGroup=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(0.8,1.2,0.5),new THREE.MeshStandardMaterial({color:0x4A90E2,roughness:0.5}));
body.position.y=0.9;body.castShadow=true;
playerGroup.add(body);
const overall=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.5,0.45),new THREE.MeshStandardMaterial({color:0x4169E1}));
overall.position.y=0.7;
playerGroup.add(overall);
const head=new THREE.Mesh(new THREE.SphereGeometry(0.35,16,16),new THREE.MeshStandardMaterial({color:0xFFD2B3}));
head.position.y=1.7;head.castShadow=true;
playerGroup.add(head);
const eyeMat=new THREE.MeshStandardMaterial({color:0x000000});
const leftEye=new THREE.Mesh(new THREE.SphereGeometry(0.05,8,8),eyeMat);
leftEye.position.set(-0.1,1.75,0.3);
playerGroup.add(leftEye);
const rightEye=new THREE.Mesh(new THREE.SphereGeometry(0.05,8,8),eyeMat);
rightEye.position.set(0.1,1.75,0.3);
playerGroup.add(rightEye);
const hatMat=new THREE.MeshStandardMaterial({color:0x8B4513});
const brim=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,0.08,16),hatMat);
brim.position.y=2.05;
playerGroup.add(brim);
const top=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.25,0.4,16),hatMat);
top.position.y=2.25;top.castShadow=true;
playerGroup.add(top);
const armGeo=new THREE.BoxGeometry(0.2,0.6,0.2);
const armMat=new THREE.MeshStandardMaterial({color:0xFFD2B3});
const leftArm=new THREE.Mesh(armGeo,armMat);
leftArm.position.set(-0.5,1.1,0);
playerGroup.add(leftArm);
const rightArm=new THREE.Mesh(armGeo,armMat);
rightArm.position.set(0.5,1.1,0);
playerGroup.add(rightArm);
const legGeo=new THREE.BoxGeometry(0.25,0.5,0.25);
const legMat=new THREE.MeshStandardMaterial({color:0x333333});
const leftLeg=new THREE.Mesh(legGeo,legMat);
leftLeg.position.set(-0.2,0.3,0);
playerGroup.add(leftLeg);
const rightLeg=new THREE.Mesh(legGeo,legMat);
rightLeg.position.set(0.2,0.3,0);
playerGroup.add(rightLeg);
const pitchfork=new THREE.Group();
const handle=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,2,8),new THREE.MeshStandardMaterial({color:0x8B4513}));
pitchfork.add(handle);
const tineMat=new THREE.MeshStandardMaterial({color:0xC0C0C0,metalness:0.8});
for(let i=-0.1;i<=0.1;i+=0.1){
const tine=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.5,6),tineMat);
tine.position.set(i,0.8,0);
tine.rotation.z=Math.PI/2;
pitchfork.add(tine);
}
pitchfork.position.set(0.5,1,0.2);
pitchfork.visible=false;
playerGroup.add(pitchfork);
scene.add(playerGroup);

const gameObjects=[];

function createGround3D(x,z,w,d){
const geo=new THREE.BoxGeometry(w,0.3,d);
const mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x8B4513,roughness:0.8}));
mesh.position.set(x,-0.15,z);
mesh.receiveShadow=true;
mesh.castShadow=true;
scene.add(mesh);
gameObjects.push(mesh);
return mesh;
}
function createPlatform3D(x,y,z){
const geo=new THREE.BoxGeometry(2,0.4,1.5);
const mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0xD2691E,roughness:0.6}));
mesh.position.set(x,y,z);
mesh.castShadow=true;
mesh.receiveShadow=true;
scene.add(mesh);
gameObjects.push(mesh);
return mesh;
}
function createCoin3D(x,y,z){
const group=new THREE.Group();
const coinGeo=new THREE.CylinderGeometry(0.5,0.5,0.1,16);
const coinMat=new THREE.MeshStandardMaterial({color:0xFFD700,metalness:0.9,roughness:0.1,emissive:0xFFD700,emissiveIntensity:0.3});
const coin=new THREE.Mesh(coinGeo,coinMat);
coin.rotation.x=Math.PI/2;
group.add(coin);
group.position.set(x,y,z);
scene.add(group);
gameObjects.push(group);
return group;
}
function createEnemy3D(x,y,z,type){
const group=new THREE.Group();
if(type=='boar'){
const bodyMat=new THREE.MeshStandardMaterial({color:0x8B4513,roughness:0.7});
const body=new THREE.Mesh(new THREE.BoxGeometry(1,0.6,0.7),bodyMat);
body.position.y=0.3;body.castShadow=true;
group.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(0.3,8,8),bodyMat);
head.position.set(0.6,0.4,0);
group.add(head);
const tuskMat=new THREE.MeshStandardMaterial({color:0xFFFFFF});
const tusk1=new THREE.Mesh(new THREE.ConeGeometry(0.05,0.3,6),tuskMat);
tusk1.position.set(0.8,0.2,0.2);
group.add(tusk1);
const tusk2=new THREE.Mesh(new THREE.ConeGeometry(0.05,0.3,6),tuskMat);
tusk2.position.set(0.8,0.2,-0.2);
group.add(tusk2);
const eye=new THREE.Mesh(new THREE.SphereGeometry(0.05,6,6),new THREE.MeshStandardMaterial({color:0xFF0000}));
eye.position.set(0.7,0.5,0.25);
group.add(eye);
}else if(type=='robot'){
const bodyMat=new THREE.MeshStandardMaterial({color:0x808080,metalness:0.6,roughness:0.4});
const body=new THREE.Mesh(new THREE.BoxGeometry(0.8,1,0.6),bodyMat);
body.position.y=0.5;body.castShadow=true;
group.add(body);
const head=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.4,0.4),bodyMat);
head.position.y=1.2;
group.add(head);
const eyeMat=new THREE.MeshStandardMaterial({color:0x00FF00,emissive:0x00FF00,emissiveIntensity:1});
const eye1=new THREE.Mesh(new THREE.SphereGeometry(0.08,6,6),eyeMat);
eye1.position.set(-0.15,1.2,0.2);
group.add(eye1);
const eye2=new THREE.Mesh(new THREE.SphereGeometry(0.08,6,6),eyeMat);
eye2.position.set(0.15,1.2,0.2);
group.add(eye2);
const antenna=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.3,6),bodyMat);
antenna.position.y=1.6;
group.add(antenna);
const tip=new THREE.Mesh(new THREE.SphereGeometry(0.05,6,6),new THREE.MeshStandardMaterial({color:0xFF0000,emissive:0xFF0000,emissiveIntensity:1}));
tip.position.y=1.75;
group.add(tip);
}else if(type=='cf'){
const bodyMat=new THREE.MeshStandardMaterial({color:0x556B2F,roughness:0.7});
const body=new THREE.Mesh(new THREE.BoxGeometry(0.9,1.1,0.5),bodyMat);
body.position.y=0.55;body.castShadow=true;
group.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(0.3,8,8),new THREE.MeshStandardMaterial({color:0xFFD2B3}));
head.position.y=1.3;
group.add(head);
const hatMat=new THREE.MeshStandardMaterial({color:0x333333});
const hat=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.35,0.1,8),hatMat);
hat.position.y=1.55;
group.add(hat);
const hatTop=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.25,0.3,8),hatMat);
hatTop.position.y=1.75;
group.add(hatTop);
const eyeMat=new THREE.MeshStandardMaterial({color:0xFF0000,emissive:0xFF0000,emissiveIntensity:0.5});
const eye1=new THREE.Mesh(new THREE.SphereGeometry(0.06,6,6),eyeMat);
eye1.position.set(-0.15,1.3,0.25);
group.add(eye1);
const eye2=new THREE.Mesh(new THREE.SphereGeometry(0.06,6,6),eyeMat);
eye2.position.set(0.15,1.3,0.25);
group.add(eye2);
}else if(type=='barrier'){
const fenceMat=new THREE.MeshStandardMaterial({color:0x8B4513,roughness:0.8});
const post1=new THREE.Mesh(new THREE.BoxGeometry(0.2,2,0.2),fenceMat);
post1.position.set(-0.5,1,0);
group.add(post1);
const post2=new THREE.Mesh(new THREE.BoxGeometry(0.2,2,0.2),fenceMat);
post2.position.set(0.5,1,0);
group.add(post2);
const rail1=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.15,0.15),fenceMat);
rail1.position.set(0,1.5,0);
group.add(rail1);
const rail2=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.15,0.15),fenceMat);
rail2.position.set(0,0.8,0);
group.add(rail2);
}else if(type=='spell'){
const spellMat=new THREE.MeshStandardMaterial({color:0xFF4500,emissive:0xFF4500,emissiveIntensity:1});
const spell=new THREE.Mesh(new THREE.SphereGeometry(0.3,8,8),spellMat);
spell.position.y=0.3;
group.add(spell);
}
group.position.set(x,y,z);
scene.add(group);
gameObjects.push(group);
return group;
}
function createBoss3D(x,y,z,type){
const group=new THREE.Group();
const bodyMat=new THREE.MeshStandardMaterial({color:type=='sw'?0x4B0082:0x800080,roughness:0.5});
const body=new THREE.Mesh(new THREE.BoxGeometry(1.5,2,0.8),bodyMat);
body.position.y=1;body.castShadow=true;
group.add(body);
const hat=new THREE.Mesh(new THREE.ConeGeometry(0.8,1,8),new THREE.MeshStandardMaterial({color:0xFF4500}));
hat.position.y=2.5;hat.castShadow=true;
group.add(hat);
const star=new THREE.Mesh(new THREE.SphereGeometry(0.15,8,8),new THREE.MeshStandardMaterial({color:0xFFD700,emissive:0xFFD700,emissiveIntensity:1}));
star.position.y=3;
group.add(star);
const eyeMat=new THREE.MeshStandardMaterial({color:0xFF0000,emissive:0xFF0000,emissiveIntensity:1});
const eye1=new THREE.Mesh(new THREE.SphereGeometry(0.1,8,8),eyeMat);
eye1.position.set(-0.4,1.5,0.4);
group.add(eye1);
const eye2=new THREE.Mesh(new THREE.SphereGeometry(0.1,8,8),eyeMat);
eye2.position.set(0.4,1.5,0.4);
group.add(eye2);
group.position.set(x,y,z);
scene.add(group);
gameObjects.push(group);
return group;
}
function createPipe3D(x,z){
const group=new THREE.Group();
const pipeMat=new THREE.MeshStandardMaterial({color:0x00CC00,roughness:0.5});
const pipe=new THREE.Mesh(new THREE.CylinderGeometry(1,1,4,16),pipeMat);
pipe.position.y=2;pipe.castShadow=true;
group.add(pipe);
const rim=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,0.5,16),pipeMat);
rim.position.y=4;rim.castShadow=true;
group.add(rim);
group.position.set(x,0,z);
scene.add(group);
gameObjects.push(group);
return group;
}

function clearObjects(){for(let obj of gameObjects){scene.remove(obj);}gameObjects.length=0;}
function stop(){running=false;if(animId)cancelAnimationFrame(animId);if(skipTimer)clearTimeout(skipTimer);globalSkipFn=null;document.getElementById('cs').style.display='none';document.getElementById('lc').style.display='none';scene.remove(playerGroup);clearObjects();renderer.dispose();}
function saveGame(){localStorage.setItem('cmsave',JSON.stringify({L:L,coins:coins,tc:tc,bc:bc,tb:tb,deaths:deaths,tt:tt}));}
function restartLevel(){projectiles=[];particles=[];if(boss){boss=null;}enemies=[];clearObjects();mk(L);}

function mk(L){
clearObjects();
enemies=[];coinList=[];bonusList=[];healthList=[];projectiles=[];particles=[];
boss=null;lt=0;lC=0;lB=0;
P.x=0;P.y=1;P.z=0;P.vx=0;P.vy=0;P.vz=0;P.hp=100;P.i=0;P.rotY=0;
I.left=false;I.right=false;I.forward=false;I.backward=false;I.jump=false;I.attack=false;
document.getElementById('cs').style.display='none';
document.getElementById('lc').style.display='none';
lw=40+L*5;gx=lw-3;
const isBoss=(L==3||L==7||L==10||L==11);
if(isBoss){
// DUNGEON
scene.background=new THREE.Color(0x1a0a00);
scene.fog=new THREE.Fog(0x1a0a00,10,30);
for(let i=0;i<15;i++){createGround3D(lw-10+i,-2,-6,1,12);}
for(let i=0;i<5;i++){createTorch(lw-8+i*2,-5);createTorch(lw-8+i*2,5);}
if(L==3||L==7)boss={mesh:createBoss3D(lw-5,0,0,'w'),x:lw-5,y:0,z:0,hp:200+L*40,mh:200+L*40,ph:1,at:0,ac:40,ac:true};
else if(L==10)boss={mesh:createBoss3D(lw-5,0,0,'sw'),x:lw-5,y:0,z:0,hp:500,mh:500,ph:1,at:0,ac:30,ac:true};
else boss={mesh:createBoss3D(lw-5,0,0,'bb'),x:lw-5,y:0,z:0,hp:800,mh:800,ph:1,at:0,ac:20,ac:true};
}else{
scene.background=new THREE.Color(0x87CEEB);
scene.fog=new THREE.Fog(0x87CEEB,30,100);
for(let i=0;i<lw;i+=2){if(i%8>6&&i>5)continue;createGround3D(i,-2,2,4);}
for(let i=0;i<lw;i+=8){createTree(i,-15,true);createTree(i+4,15,true);}
for(let i=0;i<6+L;i++){let x=6+i*(lw/(6+L));let y=2+(i%3)*2;let z=(i%2==0)?-1:1;createPlatform3D(x,y,z);platforms.push({x:x,y:y,z:z,w:2,h:0.4,d:1.5});}
// Barriers to prevent straight running
for(let i=4;i<lw-3;i+=6){let barrier=createEnemy3D(i,0,0,'barrier');enemies.push({mesh:barrier,x:i,y:0,z:0,hp:999,ac:true,type:'barrier',stationary:true});}
for(let i=0;i<5+L;i++){let x=5+i*(lw/(5+L));let z=(i%3-1)*2;let type=['boar','robot','cf'][i%3];let e=createEnemy3D(x,0,z,type);enemies.push({mesh:e,x:x,y:0,z:z,hp:40,ac:true,type:type});}
for(let i=0;i<12+L*2;i++){let x=3+i*(lw/(12+L*2));let z=(i%4-1.5);let c=createCoin3D(x,1.5,z);coinList.push({mesh:c,x:x,y:1.5,z:z,c:false});}
for(let i=0;i<3;i++){let x=6+i*(lw/3.5);let c=createCoin3D(x,4.5,0);bonusList.push({mesh:c,x:x,y:4.5,z:0,c:false});}
for(let i=0;i<Math.floor(L/3);i++){let x=6+i*(lw/Math.floor(L/3));let h=createEnemy3D(x,0,0,'robot');healthList.push({mesh:h,x:x,y:0,z:0,c:false});}
if(!boss)createPipe3D(gx,0);
}
if(cuts[L]&&!cutscenesShown[L]){cutscenesShown[L]=true;localStorage.setItem('cmcuts',JSON.stringify(cutscenesShown));cs=cuts[L];ci=0;S='cutscene';document.getElementById('cs').style.display='flex';showCuts();}else{S='playing';}
saveGame();
}

function showCuts(){globalSkipFn=function(){if(skipTimer){clearTimeout(skipTimer);skipTimer=null;}document.getElementById('cs').style.display='none';S='playing';globalSkipFn=null;};if(ci<cs.length){document.getElementById('cp').textContent=cs[ci][0];document.getElementById('ct').textContent=cs[ci][1];ci++;skipTimer=setTimeout(function(){if(S=='cutscene'&&running)showCuts();},2500);}else{if(globalSkipFn)globalSkipFn();}}

function upd(){
if(!running||S!='playing')return;
lt++;tt++;
let moveX=0,moveZ=0;
if(I.left)moveX-=1;
if(I.right)moveX+=1;
if(I.forward)moveZ-=1;
if(I.backward)moveZ+=1;
if(moveX!=0||moveZ!=0){let len=Math.sqrt(moveX*moveX+moveZ*moveZ);moveX/=len;moveZ/=len;P.rotY=Math.atan2(moveX,moveZ);}
P.vx=moveX*P.s;P.vz=moveZ*P.s;
if(I.jump){if(P.g){P.vy=P.j;P.g=false;I.jump=false;}}
if(I.attack&&P.ac<=0){P.ac=20;P.ad=8;P.attackCombo++;if(P.attackCombo>3){P.ac=40;P.attackCombo=0;}pitchfork.visible=true;setTimeout(function(){pitchfork.visible=false;},200);}
if(P.ac>0)P.ac--;if(P.ad>0)P.ad--;
P.vy-=0.02;if(P.vy<-0.5)P.vy=-0.5;
P.x+=P.vx;P.z+=P.vz;P.y+=P.vy;
if(P.y<=0.5){P.y=0.5;P.vy=0;P.g=true;}else{P.g=false;}
for(let p of platforms){if(Math.abs(P.x-p.x)<p.w/2&&Math.abs(P.z-p.z)<p.d/2&&Math.abs(P.y-p.y)<1&&P.vy<=0){P.y=p.y+0.5;P.vy=0;P.g=true;}}
if(P.x<0)P.x=0;if(P.x>lw)P.x=lw;if(P.z<-6)P.z=-6;if(P.z>6)P.z=6;
if(P.y<-5||P.hp<=0){deaths++;restartLevel();return;}
if(P.i>0)P.i--;
for(let e of enemies){if(!e.ac)continue;if(e.stationary)continue;let dx=P.x-e.x,dz=P.z-e.z;let dist=Math.sqrt(dx*dx+dz*dz);if(dist<4&&dist>1){e.x+=dx/dist*0.06;e.z+=dz/dist*0.06;}e.mesh.position.x=e.x;e.mesh.position.z=e.z;if(dist<1.5&&P.i<=0){P.hp-=15;P.i=30;if(P.hp<=0){deaths++;restartLevel();return;}}}
if(boss&&boss.ac){boss.at++;let dx=P.x-boss.x,dz=P.z-boss.z;let dist=Math.sqrt(dx*dx+dz*dz);if(dist>3){boss.x+=dx/dist*0.06;boss.z+=dz/dist*0.06;}boss.mesh.position.x=boss.x;boss.mesh.position.z=boss.z;if(boss.at>=boss.ac){boss.at=0;let spell=createEnemy3D(boss.x,boss.y+1,boss.z,'spell');projectiles.push({x:boss.x,y:1.5,z:boss.z,vx:dx/dist*0.12,vy:0.02,vz:dz/dist*0.12,life:150,mesh:spell});}if(boss.hp<=0){boss.ac=false;coins+=100;saveGame();S='lc';setTimeout(function(){document.getElementById('lc').style.display='none';if(L==10){if(tb>=30){L=11;mk(11);}else{gc(false);}}else if(L==11){gc(true);}else{L++;mk(L);}},2000);return;}}
for(let i=projectiles.length-1;i>=0;i--){let p=projectiles[i];p.x+=p.vx;p.z+=p.vz;p.y+=p.vy;p.life--;if(p.mesh){p.mesh.position.x=p.x;p.mesh.position.y=p.y;p.mesh.position.z=p.z;}let dx=P.x-p.x,dy=P.y-p.y,dz=P.z-p.z;let dist=Math.sqrt(dx*dx+dy*dy+dz*dz);if(p.life<=0||dist<1.2){if(p.mesh)scene.remove(p.mesh);projectiles.splice(i,1);if(dist<1.2){P.hp-=10;if(P.hp<=0){deaths++;restartLevel();return;}}}}
camera.position.set(P.x,P.y+8,P.z+12);
camera.lookAt(P.x,P.y,P.z);
playerGroup.position.set(P.x,P.y,P.z);
playerGroup.rotation.y=P.rotY;
for(let c of coinList){if(!c.c){let dx=P.x-c.x,dy=P.y-c.y,dz=P.z-c.z;if(Math.sqrt(dx*dx+dy*dy+dz*dz)<2){c.c=true;coins+=5;tc+=5;lC+=5;scene.remove(c.mesh);}}if(c.mesh)c.mesh.rotation.z+=0.05;}
for(let c of bonusList){if(!c.c){let dx=P.x-c.x,dy=P.y-c.y,dz=P.z-c.z;if(Math.sqrt(dx*dx+dy*dy+dz*dz)<2){c.c=true;bc++;tb++;coins+=20;lB++;scene.remove(c.mesh);}}if(c.mesh)c.mesh.rotation.z+=0.08;}
for(let h of healthList){if(!h.c){let dx=P.x-h.x,dz=P.z-h.z;if(Math.sqrt(dx*dx+dz*dz)<2){h.c=true;P.hp=Math.min(P.hp+25,P.mh);scene.remove(h.mesh);}}}
if(P.ad>0){for(let e of enemies){if(e.ac&&!e.stationary){let dx=P.x-e.x,dz=P.z-e.z;if(Math.sqrt(dx*dx+dz*dz)<2.5){e.hp-=20;if(e.hp<=0){e.ac=false;coins+=10;scene.remove(e.mesh);}}}}if(boss&&boss.ac){let dx=P.x-boss.x,dz=P.z-boss.z;if(Math.sqrt(dx*dx+dz*dz)<3.5){boss.hp-=10;}}}
if(!boss&&P.x>=gx)cl__();
}

function cl__(){S='lc';saveGame();document.getElementById('ls').textContent='Coins: '+lC+' | Bonus: '+lB+'/3';document.getElementById('lc').style.display='block';setTimeout(function(){document.getElementById('lc').style.display='none';if(L<10){L++;mk(L);}},2000);}
function gc(completed){saveGame();if(completed){alert(t('cm')+'\n\n'+t('tc')+': '+tc+'\n'+t('bn')+': '+tb+'\n'+t('dt')+': '+deaths);}else{alert(t('cm')+'\n\n'+t('tc')+': '+tc+'\n'+t('bn')+': '+tb+'/30\n'+t('needBonus'));}localStorage.removeItem('cmsave');localStorage.removeItem('cmcuts');setTimeout(function(){location.reload();},2000);}

function setupControls(){function bind(id,action){const el=document.getElementById(id);el.addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();I[action]=true;},{passive:false});el.addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();I[action]=false;},{passive:false});el.addEventListener('touchcancel',function(){I[action]=false;});el.addEventListener('mousedown',function(){I[action]=true;});el.addEventListener('mouseup',function(){I[action]=false;});el.addEventListener('mouseleave',function(){I[action]=false;});}bind('l','left');bind('r','right');bind('fw','forward');bind('bw','backward');bind('j','jump');bind('a','attack');}

function loop(){if(!running)return;if(S=='playing'){upd();}renderer.render(scene,camera);document.getElementById('hp').style.width=(P.hp/P.mh*100)+'%';document.getElementById('cc').textContent=coins;document.getElementById('bc').textContent=lB+'/3';document.getElementById('lv').textContent=t('lv')+' '+L;animId=requestAnimationFrame(loop);}

gameInstance={stop:stop};
setupControls();mk(L);loop();
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
</body>
</html>
