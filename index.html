function initAudio(){if(!audioContext){try{audioContext=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}}
function playTone(freq,duration,type,volume){if(!audioContext)return;try{const osc=audioContext.createOscillator();const gain=audioContext.createGain();osc.type=type||'square';osc.frequency.setValueAtTime(freq,audioContext.currentTime);gain.gain.setValueAtTime(volume||0.1,audioContext.currentTime);gain.gain.exponentialRampToValueAtTime(0.001,audioContext.currentTime+duration);osc.connect(gain);gain.connect(audioContext.destination);osc.start();osc.stop(audioContext.currentTime+duration);}catch(e){}}

function startMusic(type){if(!audioContext)initAudio();if(!audioContext)return;stopMusic();currentMusic=type;let beat=0;musicInterval=setInterval(function(){if(type=='farm'){if(beat%4==0)playTone(261,0.2,'triangle',0.05);if(beat%4==2)playTone(329,0.2,'triangle',0.05);if(beat%8==4)playTone(392,0.2,'triangle',0.05);if(beat%8==0)playTone(261,0.3,'sine',0.03);}else if(type=='dungeon'){if(beat%4==0)playTone(130,0.3,'sawtooth',0.04);if(beat%4==2)playTone(98,0.3,'sawtooth',0.04);if(beat%8==0)playTone(65,0.5,'sine',0.05);}else if(type=='boss'){if(beat%2==0)playTone(110,0.15,'square',0.08);if(beat%4==0)playTone(165,0.15,'square',0.08);if(beat%8==0)playTone(220,0.2,'square',0.1);}beat++;if(beat>64)beat=0;},250);}
function stopMusic(){if(musicInterval){clearInterval(musicInterval);musicInterval=null;}currentMusic=null;}
function initGame(){
if(typeof THREE==='undefined'){alert('3D engine not loaded. Reload page.');return;}
if(gameInstance){gameInstance.stop();gameInstance=null;}
const testCanvas=document.createElement('canvas');
const gl=testCanvas.getContext('webgl')||testCanvas.getContext('experimental-webgl');

const container=document.getElementById('c');

const H=container.clientHeight||420;
let running=true,animId=null,skipTimer=null;

let questLog=[],checkpointX=0,hasCheckpoint=false;

const P={x:0,y:1,z:0,vx:0,vy:0,vz:0,s:0.25,j:0.5,hp:100,mh:100,ac:0,ad:0,f:1,g:false,i:0,dj:false,dja:false,au:false,su:false,attackCombo:0,rotY:0,hasShield:false,walkCycle:0,isWalking:false};
let platforms=[],enemies=[],coinList=[],bonusList=[],healthList=[],projectiles=[],particles=[],boss=null,lw=0,gx=0,weatherEffects=[],decorations=[],npcs=[],powerUps=[],bridges=[],waterAreas=[],gameObjects=[];

window._gameNPCs=npcs;

S='playing';

for(let i=0;i<15;i++){const cloud=new THREE.Group();const c1=new THREE.Mesh(new THREE.SphereGeometry(2+Math.random(),8,8),cloudMat);cloud.add(c1);const c2=new THREE.Mesh(new THREE.SphereGeometry(1.5+Math.random(),8,8),cloudMat);c2.position.set(2,0.5,0);cloud.add(c2);const c3=new THREE.Mesh(new THREE.SphereGeometry(1.8+Math.random(),8,8),cloudMat);c3.position.set(-1.5,0.3,0.5);cloud.add(c3);cloud.position.set(Math.random()*80-40,20+Math.random()*10,Math.random()*60-30);scene.add(cloud);decorations.push(cloud);}

function createTree(x,z,far){const tree=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.5,3,8),new THREE.MeshStandardMaterial({color:0x654321,roughness:0.9}));trunk.position.y=1.5;tree.add(trunk);const leafMat=new THREE.MeshStandardMaterial({color:far?'#1a5a1a':'#228B22',roughness:0.7});const size=far?4:2.5;const leaf1=new THREE.Mesh(new THREE.SphereGeometry(size,10,10),leafMat);leaf1.position.y=4;leaf1.castShadow=true;tree.add(leaf1);const leaf2=new THREE.Mesh(new THREE.SphereGeometry(size*0.7,8,8),leafMat);leaf2.position.set(size*0.5,3.5,size*0.3);tree.add(leaf2);const leaf3=new THREE.Mesh(new THREE.SphereGeometry(size*0.6,8,8),leafMat);leaf3.position.set(-size*0.4,4,size*0.2);tree.add(leaf3);const leaf4=new THREE.Mesh(new THREE.SphereGeometry(size*0.5,8,8),leafMat);leaf4.position.set(size*0.2,4.5,-size*0.3);tree.add(leaf4);tree.position.set(x,0,z);scene.add(tree);return tree;}

function createWater(x,z,w,d){const waterGeo=new THREE.PlaneGeometry(w,d);const waterMat=new THREE.MeshStandardMaterial({color:0x4488FF,roughness:0.1,metalness:0.5,transparent:true,opacity:0.8});const water=new THREE.Mesh(waterGeo,waterMat);water.rotation.x=-Math.PI/2;water.position.set(x,0.05,z);scene.add(water);waterAreas.push({x:x,z:z,w:w,d:d,mesh:water});return water;}
function createBridge(x,z,w){const bridgeGroup=new THREE.Group();const plankMat=new THREE.MeshStandardMaterial({color:0x8B4513,roughness:0.7});for(let i=0;i<w;i+=0.5){const plank=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.1,1.5),plankMat);plank.position.set(i,0.3,0);bridgeGroup.add(plank);}const railMat=new THREE.MeshStandardMaterial({color:0x654321});const rail1=new THREE.Mesh(new THREE.BoxGeometry(w,0.1,0.1),railMat);rail1.position.set(w/2,0.6,0.6);bridgeGroup.add(rail1);const rail2=rail1.clone();rail2.position.z=-0.6;bridgeGroup.add(rail2);bridgeGroup.position.set(x,0,z);scene.add(bridgeGroup);bridges.push({x:x,z:z,w:w,mesh:bridgeGroup});return bridgeGroup;}

function upd(){
if(window._gameState&&window._gameState.S=='playing'&&S=='paused'){S='playing';}
if(!running||S!='playing')return;
lt++;tt++;
let moveX=0,moveZ=0;
if(I.left)moveX-=1;
if(I.right)moveX+=1;
if(I.forward)moveZ-=1;
if(I.backward)moveZ+=1;
if(moveX!=0||moveZ!=0){
let len=Math.sqrt(moveX*moveX+moveZ*moveZ);
moveX/=len;moveZ/=len;
P.rotY=Math.atan2(moveX,moveZ);
P.isWalking=true;
}else{P.isWalking=false;}
P.vx=moveX*P.s;
P.vz=moveZ*P.s;
if(I.jump){
if(P.g){
P.vy=P.j;P.g=false;I.jump=false;
playJumpSound();
}
}
if(I.attack&&P.ac<=0){
P.ac=20;P.ad=8;P.attackCombo++;
if(P.attackCombo>3){P.ac=40;P.attackCombo=0;}
pitchfork.visible=true;
playAttackSound();
setTimeout(function(){pitchfork.visible=false;},200);
}
if(P.ac>0)P.ac--;if(P.ad>0)P.ad--;
P.vy-=0.02;if(P.vy<-0.5)P.vy=-0.5;
P.x+=P.vx;P.z+=P.vz;P.y+=P.vy;
if(P.y<=0.5){P.y=0.5;P.vy=0;P.g=true;}else{P.g=false;}
for(let p of platforms){
if(Math.abs(P.x-p.x)<p.w/2&&Math.abs(P.z-p.z)<p.d/2&&Math.abs(P.y-p.y)<1&&P.vy<=0){
P.y=p.y+0.5;P.vy=0;P.g=true;
}
}
for(let w of waterAreas){
if(Math.abs(P.x-w.x)<w.w/2&&Math.abs(P.z-w.z)<w.d/2){
P.hp-=0.5;
if(P.hp<=0){deaths++;playDeathSound();restartLevel();return;}
}
}
for(let b of bridges){
if(Math.abs(P.x-b.x)<b.w/2&&Math.abs(P.z-b.z)<1&&P.vy<=0&&P.y>0.2){
P.y=0.35;P.vy=0;P.g=true;
}
}
if(P.x<0)P.x=0;if(P.x>lw)P.x=lw;
if(P.z<-6)P.z=-6;if(P.z>6)P.z=6;
if(P.y<-5||P.hp<=0){deaths++;playDeathSound();restartLevel();return;}
if(P.i>0)P.i--;
if(hasCheckpoint&&P.x>=checkpointX&&P.x<checkpointX+2){
checkpointX=P.x;
saveGame();
}
for(let e of enemies){
if(!e.ac)continue;
if(e.stationary)continue;
let dx=P.x-e.x,dz=P.z-e.z;
let dist=Math.sqrt(dx*dx+dz*dz);
if(dist<4&&dist>1){e.x+=dx/dist*0.06;e.z+=dz/dist*0.06;}
e.mesh.position.x=e.x;e.mesh.position.z=e.z;
if(e.mesh.userData.legs){
e.mesh.userData.animPhase+=0.15;
for(let i=0;i<e.mesh.userData.legs.length;i++){
e.mesh.userData.legs[i].position.z=Math.sin(e.mesh.userData.animPhase+i)*0.25;
}
}
if(e.mesh.userData.arms){
e.mesh.userData.arms[0].rotation.z=Math.sin(tt*0.1)*0.3;
e.mesh.userData.arms[1].rotation.z=-Math.sin(tt*0.1)*0.3;
}
if(e.mesh.userData.tip){
e.mesh.userData.tip.scale.setScalar(1+Math.sin(tt*0.2)*0.3);
}
if(e.mesh.userData.eyes){
e.mesh.userData.eyes[0].scale.setScalar(1+Math.sin(tt*0.15)*0.2);
e.mesh.userData.eyes[1].scale.setScalar(1+Math.sin(tt*0.15)*0.2);
}
if(e.mesh.userData.tail){
e.mesh.userData.tail.rotation.z=-Math.PI/2+Math.sin(tt*0.1)*0.3;
}
if(dist<1.5&&P.i<=0){
P.hp-=15;P.i=30;playHitSound();
createHitParticle(P.x,P.y+1,P.z,0xFF0000);
if(P.hp<=0){deaths++;restartLevel();return;}
}
}
if(boss&&boss.ac){
boss.at++;
let dx=P.x-boss.x,dz=P.z-boss.z;
let dist=Math.sqrt(dx*dx+dz*dz);
if(dist>3){boss.x+=dx/dist*0.06;boss.z+=dz/dist*0.06;}
boss.mesh.position.x=boss.x;boss.mesh.position.z=boss.z;
if(boss.mesh.userData.star){
boss.mesh.userData.star.rotation.y+=0.15;
boss.mesh.userData.star.position.y=3.3+Math.sin(tt*0.1)*0.15;
}
if(boss.mesh.userData.orb){
boss.mesh.userData.orb.position.y=3+Math.sin(tt*0.15)*0.2;
boss.mesh.userData.orb.scale.setScalar(1+Math.sin(tt*0.2)*0.2);
}
if(boss.mesh.userData.hat){
boss.mesh.userData.hat.rotation.y+=0.02;
}
if(boss.mesh.userData.staff){
boss.mesh.userData.staff.rotation.z=Math.sin(tt*0.05)*0.1;
}
if(boss.at>=boss.ac){
boss.at=0;
playBossSound();
let spell=createEnemy3D(boss.x,boss.y+1,boss.z,'spell');
projectiles.push({x:boss.x,y:1.5,z:boss.z,vx:dx/dist*0.12,vy:0.02,vz:dz/dist*0.12,life:150,mesh:spell});
}
if(boss.hp<=0){
boss.ac=false;coins+=100;
createVictoryParticles(boss.x,boss.y,boss.z);
playVictorySound();
saveGame();S='lc';
setTimeout(function(){
document.getElementById('lc').style.display='none';
if(L==10){if(tb>=30){L=11;mk(11);}else{gc(false);}}
else if(L==11){gc(true);}
else{L++;mk(L);}
},2000);
return;
}
}
for(let i=projectiles.length-1;i>=0;i--){
let p=projectiles[i];
p.x+=p.vx;p.z+=p.vz;p.y+=p.vy;p.life--;
if(p.mesh){
p.mesh.position.x=p.x;p.mesh.position.y=p.y;p.mesh.position.z=p.z;
if(p.mesh.userData.orbit)p.mesh.userData.orbit.rotation.z+=0.1;
}
let dx=P.x-p.x,dy=P.y-p.y,dz=P.z-p.z;
let dist=Math.sqrt(dx*dx+dy*dy+dz*dz);
if(p.life<=0||dist<1.2){
if(p.mesh)scene.remove(p.mesh);
projectiles.splice(i,1);
if(dist<1.2){
if(P.hasShield){P.hasShield=false;createHitParticle(P.x,P.y+1,P.z,0x4488FF);}
else{
P.hp-=3;createHitParticle(P.x,P.y+1,P.z,0xFF0000);playHitSound();
if(P.hp<=0){deaths++;restartLevel();return;}
}
}
}
}
for(let i=particles.length-1;i>=0;i--){
let p=particles[i];
p.mesh.position.x+=p.vx;p.mesh.position.y+=p.vy;p.mesh.position.z+=p.vz;
p.life--;
if(p.life<=0){scene.remove(p.mesh);particles.splice(i,1);}
}
for(let w of weatherEffects){
w.mesh.position.y-=w.vy;
if(w.mesh.position.y<-5){w.mesh.position.y=20;w.mesh.position.x=Math.random()*80-40;}
}
for(let p of platforms){
if(p.moving){
p.phase+=0.02*p.moveSpeed;
if(p.mesh){
p.mesh.position.x=p.originalX+Math.sin(p.phase)*p.moveRange;
p.x=p.mesh.position.x;
}
}
}
for(let d of decorations){
if(d.children&&d.children.length>0&&d.position.y>15){
d.position.x+=0.02;
if(d.position.x>60)d.position.x=-60;
}
}
for(let d of decorations){
if(d.userData&&d.userData.flame){
d.userData.flame.scale.setScalar(1+Math.sin(tt*0.2+d.position.x)*0.2);
}
}
for(let pu of powerUps){
pu.rotation.y+=0.03;
pu.position.y=1+Math.sin(tt*0.05+pu.userData.phase)*0.2;
}
camera.position.set(P.x,P.y+8,P.z+12);
camera.lookAt(P.x,P.y,P.z);
playerGroup.position.set(P.x,P.y,P.z);
playerGroup.rotation.y=P.rotY;
if(P.isWalking&&P.g){
P.walkCycle+=0.15;
if(playerParts.leftLeg)playerParts.leftLeg.position.z=Math.sin(P.walkCycle)*0.25;
if(playerParts.rightLeg)playerParts.rightLeg.position.z=-Math.sin(P.walkCycle)*0.25;
if(playerParts.leftArm)playerParts.leftArm.position.z=-Math.sin(P.walkCycle)*0.2;
if(playerParts.rightArm)playerParts.rightArm.position.z=Math.sin(P.walkCycle)*0.2;
}else{
if(playerParts.leftLeg)playerParts.leftLeg.position.z=0;
if(playerParts.rightLeg)playerParts.rightLeg.position.z=0;
if(playerParts.leftArm)playerParts.leftArm.position.z=0;
if(playerParts.rightArm)playerParts.rightArm.position.z=0;
}
for(let c of coinList){
if(!c.c){
let dx=P.x-c.x,dy=P.y-c.y,dz=P.z-c.z;
if(Math.sqrt(dx*dx+dy*dy+dz*dz)<2){
c.c=true;coins+=5;tc+=5;lC+=5;
createHitParticle(c.x,c.y,c.z,0xFFD700);
playCoinSound();
scene.remove(c.mesh);
}
}
if(c.mesh)c.mesh.rotation.z+=0.05;
}
for(let c of bonusList){
if(!c.c){
let dx=P.x-c.x,dy=P.y-c.y,dz=P.z-c.z;
if(Math.sqrt(dx*dx+dy*dy+dz*dz)<2){
c.c=true;bc++;tb++;coins+=20;lB++;
createVictoryParticles(c.x,c.y,c.z);
playCoinSound();
scene.remove(c.mesh);
}
}
if(c.mesh)c.mesh.rotation.z+=0.08;
}
for(let h of healthList){
if(!h.c){
let dx=P.x-h.x,dz=P.z-h.z;
if(Math.sqrt(dx*dx+dz*dz)<2){
h.c=true;P.hp=Math.min(P.hp+25,P.mh);
createHitParticle(h.x,h.y,h.z,0xFF0000);
playCoinSound();
scene.remove(h.mesh);
}
}
}
for(let pu of powerUps){
let dx=P.x-pu.position.x,dz=P.z-pu.position.z;
if(Math.sqrt(dx*dx+dz*dz)<1.5){
if(pu.userData.type=='speed'){P.s=0.35;playVictorySound();}
if(pu.userData.type=='attack'){P.au=true;playVictorySound();}
if(pu.userData.type=='shield'){P.hasShield=true;playVictorySound();}
createVictoryParticles(pu.position.x,pu.position.y,pu.position.z);
scene.remove(pu);
}
}
for(let n of npcs){
let dx=P.x-n.position.x,dz=P.z-n.position.z;
if(Math.sqrt(dx*dx+dz*dz)<2){
showNPCDialogue(n);
}
}
if(P.ad>0){
for(let e of enemies){
if(e.ac&&!e.stationary){
let dx=P.x-e.x,dz=P.z-e.z;
if(Math.sqrt(dx*dx+dz*dz)<2.5){
e.hp-=P.au?30:20;
createHitParticle(e.x,e.y+0.5,e.z,0xFFD700);
playHitSound();
if(e.hp<=0){
e.ac=false;coins+=10;
createDeathParticles(e.x,e.y+0.5,e.z,e.mesh.userData.type=='boar'?0x8B4513:e.mesh.userData.type=='robot'?0x808080:0x556B2F);
scene.remove(e.mesh);
}
}
}
}
if(boss&&boss.ac){
let dx=P.x-boss.x,dz=P.z-boss.z;
if(Math.sqrt(dx*dx+dz*dz)<3.5){
boss.hp-=P.au?15:10;
createHitParticle(boss.x,boss.y+1,boss.z,0xFFD700);
}
}
}
if(!boss&&P.x>=gx)cl__();
}
function showNPCDialogue(npc){
if(npc.userData.isTalking)return;
npc.userData.isTalking=true;
const msg=npc.userData.message;
const dialogue=document.createElement('div');
dialogue.style.cssText='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.95);color:#FFD700;padding:20px;border-radius:15px;text-align:center;z-index:95;border:3px solid #FFD700;max-width:80%;pointer-events:auto';
dialogue.innerHTML='<div style="font-size:40px;margin-bottom:10px">'+(npc.userData.type=='chicken'?'🐔':npc.userData.type=='villager'?'👨‍🌾':'🛒')+'</div><p style="margin-bottom:15px">'+msg+'</p>';
if(npc.userData.type=='merchant'){
const buySpeedBtn=document.createElement('button');
buySpeedBtn.textContent='⚡ '+t('buySpeed');
buySpeedBtn.style.cssText='padding:8px 15px;margin:3px;background:#FFD700;border:none;border-radius:10px;cursor:pointer;display:block;width:100%';
buySpeedBtn.onclick=function(){
if(coins>=50){coins-=50;P.s=0.35;playVictorySound();alert(t('purchased'));}
else{alert(t('insufficient'));}
dialogue.remove();
npc.userData.isTalking=false;
saveGame();
};
dialogue.appendChild(buySpeedBtn);
const buyAttackBtn=document.createElement('button');
buyAttackBtn.textContent='⚔️ '+t('buyAttack');
buyAttackBtn.style.cssText='padding:8px 15px;margin:3px;background:#FFD700;border:none;border-radius:10px;cursor:pointer;display:block;width:100%';
buyAttackBtn.onclick=function(){
if(coins>=50){coins-=50;P.au=true;playVictorySound();alert(t('purchased'));}
else{alert(t('insufficient'));}
dialogue.remove();
npc.userData.isTalking=false;
saveGame();
};
dialogue.appendChild(buyAttackBtn);
const buyShieldBtn=document.createElement('button');
buyShieldBtn.textContent='🛡️ '+t('buyShield');
buyShieldBtn.style.cssText='padding:8px 15px;margin:3px;background:#FFD700;border:none;border-radius:10px;cursor:pointer;display:block;width:100%';
buyShieldBtn.onclick=function(){
if(coins>=75){coins-=75;P.hasShield=true;playVictorySound();alert(t('purchased'));}
else{alert(t('insufficient'));}
dialogue.remove();
npc.userData.isTalking=false;
saveGame();
};
dialogue.appendChild(buyShieldBtn);
}
const exitBtn=document.createElement('button');
exitBtn.textContent=t('exit');
exitBtn.style.cssText='padding:8px 20px;margin-top:10px;background:#333;color:#fff;border:none;border-radius:10px;cursor:pointer;display:block;width:100%';
exitBtn.onclick=function(){
dialogue.remove();
npc.userData.isTalking=false;
};
dialogue.appendChild(exitBtn);
dialogue.id='npcDialogue';
document.getElementById('w').appendChild(dialogue);
}
function closeDialogueNow(){
const d=document.getElementById('npcDialogue');
if(d)d.remove();
S='playing';
if(window._gameState)window._gameState.S='playing';
for(let n of npcs){n.userData.isTalking=false;}
startMusic(L==3||L==7||L==10||L==11?'boss':'farm');
    }
function cl__(){
S='lc';
saveGame();
document.getElementById('ls').textContent='Coins: '+lC+' | Bonus: '+lB+'/3 | Time: '+Math.floor(lt/60)+'s';
document.getElementById('lc').style.display='block';
setTimeout(function(){
document.getElementById('lc').style.display='none';
if(L<10){L++;mk(L);}
},2000);
}
function gc(completed){
saveGame();
if(completed){
alert(t('cm')+'\n\n'+t('tc')+': '+tc+'\n'+t('bn')+': '+tb+'\n'+t('dt')+': '+deaths+'\n'+t('tm')+': '+Math.floor(tt/60)+'s');
}else{
alert(t('cm')+'\n\n'+t('tc')+': '+tc+'\n'+t('bn')+': '+tb+'/30\n'+t('needBonus'));
}
localStorage.removeItem('cmsave');
localStorage.removeItem('cmcuts');
setTimeout(function(){location.reload();},2000);
}
function setupControls(){
function bind(id,action){
const el=document.getElementById(id);
if(!el)return;
el.addEventListener('touchstart',function(e){
e.preventDefault();e.stopPropagation();I[action]=true;
},{passive:false});
el.addEventListener('touchend',function(e){
e.preventDefault();e.stopPropagation();I[action]=false;
},{passive:false});
el.addEventListener('touchcancel',function(){I[action]=false;});
el.addEventListener('mousedown',function(){I[action]=true;});
el.addEventListener('mouseup',function(){I[action]=false;});
el.addEventListener('mouseleave',function(){I[action]=false;});
}
bind('l','left');
bind('r','right');
bind('fw','forward');
bind('bw','backward');
bind('j','jump');
bind('a','attack');
document.addEventListener('keydown',function(e){
if(e.key=='ArrowLeft'||e.key=='a')I.left=true;
if(e.key=='ArrowRight'||e.key=='d')I.right=true;
if(e.key=='ArrowUp'||e.key=='w')I.forward=true;
if(e.key=='ArrowDown'||e.key=='s')I.backward=true;
if(e.key==' '||e.key=='j')I.jump=true;
if(e.key=='x'||e.key=='k')I.attack=true;
if(e.key=='p'||e.key=='Escape')togglePause();
});
document.addEventListener('keyup',function(e){
if(e.key=='ArrowLeft'||e.key=='a')I.left=false;
if(e.key=='ArrowRight'||e.key=='d')I.right=false;
if(e.key=='ArrowUp'||e.key=='w')I.forward=false;
if(e.key=='ArrowDown'||e.key=='s')I.backward=false;
if(e.key==' '||e.key=='j')I.jump=false;
if(e.key=='x'||e.key=='k')I.attack=false;
});
}
function togglePause(){
if(window._gameState)window._gameState.S=S;
if(S=='playing'){
S='paused';
stopMusic();
document.getElementById('lc').textContent=t('pause');
document.getElementById('lc').style.display='block';
}else if(S=='paused'){
S='playing';
document.getElementById('lc').style.display='none';
startMusic(L==3||L==7||L==10||L==11?'boss':'farm');
}
}
function drawMiniMap(){
let mm=document.getElementById('miniMap');
if(!mm){
mm=document.createElement('canvas');
mm.id='miniMap';
mm.width=100;mm.height=60;
mm.style.cssText='position:absolute;top:50px;right:10px;z-index:50;border:2px solid #FFD700;border-radius:5px;background:rgba(0,0,0,.7)';
document.getElementById('w').appendChild(mm);
}
const ctx=mm.getContext('2d');
ctx.clearRect(0,0,100,60);
ctx.fillStyle='rgba(0,0,0,.8)';
ctx.fillRect(0,0,100,60);
ctx.fillStyle='#8B4513';
ctx.fillRect(0,25,100,10);
for(let w of waterAreas){
const wx=(w.x/lw)*100;
ctx.fillStyle='#4488FF';
ctx.fillRect(wx,20,(w.w/lw)*100,20);
}
for(let b of bridges){
const bx=(b.x/lw)*100;
ctx.fillStyle='#A0522D';
ctx.fillRect(bx,22,(b.w/lw)*100,16);
}
for(let e of enemies){
if(!e.ac)continue;
const ex=(e.x/lw)*100;
ctx.fillStyle='#FF0000';
ctx.fillRect(ex-2,27,4,4);
}
for(let n of npcs){
const nx=(n.position.x/lw)*100;
ctx.fillStyle='#00FF00';
ctx.beginPath();
ctx.arc(nx,30,3,0,Math.PI*2);
ctx.fill();
}
if(boss&&boss.ac){
const bx=(boss.x/lw)*100;
ctx.fillStyle='#FF00FF';
ctx.beginPath();
ctx.arc(bx,30,6,0,Math.PI*2);
ctx.fill();
}
const playerX=(P.x/lw)*100;
ctx.fillStyle='#FFD700';
ctx.beginPath();
ctx.arc(playerX,30,5,0,Math.PI*2);
ctx.fill();
ctx.fillStyle='#FFF';
ctx.beginPath();
ctx.arc(playerX,30,2,0,Math.PI*2);
ctx.fill();
ctx.fillStyle='#00FF00';
ctx.fillRect(95,22,5,15);
}
function loop(){
if(!running)return;
if(window._gameState&&window._gameState.S=='playing'&&S=='paused'){S='playing';}
if(S=='playing'){upd();}
renderer.render(scene,camera);
document.getElementById('hp').style.width=(P.hp/P.mh*100)+'%';
document.getElementById('cc').textContent=coins;
document.getElementById('bc').textContent=lB+'/3';
document.getElementById('lv').textContent=t('lv')+' '+L;
drawMiniMap();
animId=requestAnimationFrame(loop);
}
gameInstance={stop:stop};
setupControls();
mk(L);
loop();
    }
window.addEventListener('error',function(e){
console.error('Game error:',e.message);
if(e.message&&e.message.includes('THREE')){
if(confirm('Graphics error detected. Reload page?')){
location.reload();
}
}
});
window.addEventListener('resize',function(){
if(gameInstance&&typeof camera!=='undefined'&&typeof renderer!=='undefined'){
const container=document.getElementById('c');
if(container){
const W=container.clientWidth||500;
const H=container.clientHeight||420;
camera.aspect=W/H;
camera.updateProjectionMatrix();
renderer.setSize(W,H);
}
}
});
document.addEventListener('visibilitychange',function(){
if(document.hidden&&typeof S!=='undefined'&&S=='playing'){
togglePause();
}
});
if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js').catch(function(){
console.log('Service Worker registration failed');
});
}
if(typeof THREE==='undefined'){
alert('Three.js failed to load. Please check your internet connection and reload.');
}else{
console.log('🐔 Chicken Mania ready!');
console.log('🎮 Controls: Arrow keys/WASD to move, Space/J to jump, X/K to attack');
console.log('📱 Mobile: Use on-screen D-pad and buttons');
console.log('💾 Progress saves automatically');
console.log('🔊 Audio requires user interaction first (tap Start)');
console.log('📋 Talk to NPCs for hints, visit merchants to buy upgrades');
}
document.addEventListener('touchmove',function(e){
if(e.target.closest('#c')||e.target.closest('#b')){
e.preventDefault();
}
},{passive:false});
document.addEventListener('keydown',function(e){
if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)){
e.preventDefault();
}
});
</script>
